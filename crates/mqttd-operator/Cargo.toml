[package]
name = "mqttd-operator"
description = "Kubernetes operator for mqttd clusters (ADR 0055): MqttdCluster CRD + reconciler"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
# The Kubernetes client + controller runtime (ADR 0055 §1). rustls-tls keeps the
# workspace's single TLS stack (ADR 0053: aws-lc-rs provider via feature unification).
kube = { version = "4", default-features = false, features = ["client", "runtime", "derive", "rustls-tls"] }
k8s-openapi = { version = "0.28", features = ["latest"] }
# JSON Schema derivation for the CRD's openAPIV3Schema (kube derive requirement).
schemars = "1"
# Reading each broker's /statusz over plain HTTP on the ops network (ADR 0054);
# no TLS features — the health listener is unauthenticated plaintext by design.
reqwest = { workspace = true }
# The config checksum behind the pod roll-on-change annotation; the workspace
# crypto provider (ADR 0053), already in the tree.
aws-lc-rs = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
futures-util = { workspace = true }

[lints]
workspace = true
