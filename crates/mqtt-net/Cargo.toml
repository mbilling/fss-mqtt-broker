[package]
name = "mqtt-net"
description = "Connection and listener layer (TCP, TLS, WebSocket)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mqtt-codec = { path = "../mqtt-codec", version = "1.0.0" }
thiserror.workspace = true
tokio.workspace = true
bytes.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
rustls-pki-types.workspace = true
tokio-tungstenite.workspace = true
futures-util.workspace = true
quinn.workspace = true

[features]
# FIPS 140-3 build variant (ADR 0068): swaps the crypto to the validated
# AWS-LC module across the whole graph. A variant, not a default: heavier
# build (cmake + Go), narrower platform matrix.
fips = ["rustls/fips", "tokio-rustls/fips", "quinn/rustls-aws-lc-rs-fips"]

[dev-dependencies]
rcgen.workspace = true

[lints]
workspace = true
