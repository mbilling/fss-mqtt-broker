# Fuzz harness for the WebAssembly sandbox (ADR 0086): the loader, which takes a
# module file an operator supplies, and the calls into what it accepted.
# Requires nightly + cargo-fuzz:  cargo install cargo-fuzz
# Run:                            cargo +nightly fuzz run module_load
#
# The empty [workspace] table detaches this crate from the parent workspace so
# the stable build/CI never tries to compile the nightly-only libfuzzer harness.
[package]
name = "mqtt-wasm-sandbox-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
mqtt-wasm-sandbox = { path = ".." }

[[bin]]
name = "module_load"
path = "fuzz_targets/module_load.rs"
test = false
doc = false
bench = false

[workspace]
