[package]
name = "mqtt-wasm-sandbox"
description = "ADR 0086: rule functions run as WebAssembly modules in a sandbox — the real jq first"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false
build = "build.rs"

[dependencies]
# The runtime (Apache-2.0 WITH LLVM-exception, MSRV 1.97): Cranelift compiles a module
# to machine code when it is loaded. Not the defaults, only:
#   runtime, cranelift, std  the runtime and its compiler;
#   async                    a call runs on a stack of its own (a fiber), so a module's
#                            recursion can never reach the end of the caller's stack;
#   pulley                   the runtime's interpreter, for hosts that forbid
#                            executable memory (`Execution::Interpreted`).
# No component model, no WASI, no garbage collector, no threads, no on-disk code cache,
# no profiling or debugger hooks, no text format, no parallel compilation (rayon), no
# backtraces.
wasmtime = { version = "50.0.0", default-features = false, features = ["runtime", "cranelift", "async", "pulley", "std"] }

[build-dependencies]
# build.rs compares the jq module it embeds with `jq-module/jq.wasm.sha256`. Already
# in the broker's graph (mqtt-rules).
sha2 = "0.11"

[dev-dependencies]
# The rule engine's exact JSON writer and reader: the jq tests marshal as a rule would.
# Without its `jq` feature, which is this crate.
mqtt-rules = { path = "../mqtt-rules", default-features = false }
# Reads the EMQX oracle file (programs and outputs are base64 there).
base64 = "0.23"
# The module file's hash against the recorded one.
sha2 = "0.11"

[features]
# The tests and examples that read jq.wasm from its file (`jq-module/build.sh`, not
# checked in). Off by default, so a build without the Wasm toolchain stays whole. This
# is not what embeds the module in a build: build.rs does, when it finds the file.
jq-module = []
# The hand-written module of `test_module`: what the tests of the crates that load
# operator modules (mqtt-rules, mqttd) run without a Wasm toolchain. Test builds only.
test-module = []

[[test]]
name = "jq_module"
required-features = ["jq-module"]

[lints]
workspace = true
