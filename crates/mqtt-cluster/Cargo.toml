[package]
name = "mqtt-cluster"
description = "Shared-nothing cluster: gossip membership, subscription routing"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mqtt-core = { path = "../mqtt-core", version = "1.0.0" }
mqtt-storage = { path = "../mqtt-storage", version = "1.0.0" }
thiserror.workspace = true
serde = { workspace = true }
postcard = { workspace = true }
bytes = { workspace = true }
tokio = { workspace = true }
tracing = { workspace = true }
aws-lc-rs = { workspace = true }
async-trait = "0.1"
openraft = { version = "0.9.24", features = ["serde"] }
# On-disk persistence for the lease consensus store (ADR 0018 phase 2).
redb = "2"

[features]
# FIPS 140-3 build variant (ADR 0068): swaps the crypto to the validated
# AWS-LC module across the whole graph. A variant, not a default: heavier
# build (cmake + Go), narrower platform matrix.
fips = ["aws-lc-rs/fips"]
# DIAGNOSTIC ONLY — never in a shipped build: lets MQTTD_DIAG_SIMULATED_FSYNC_US replace
# every segment-log data sync with a sleep, for controlled fsync-latency sweeps on one
# machine (see stage_timing.rs). A build with it is NOT durable.
diag-simulated-fsync = []

[dev-dependencies]
tempfile = "3"
criterion = { workspace = true }

[[bench]]
name = "durable_hotpaths"
harness = false

[lints]
workspace = true
