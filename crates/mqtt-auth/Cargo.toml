[package]
name = "mqtt-auth"
description = "Authentication and authorization traits and built-in providers"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mqtt-core = { path = "../mqtt-core", version = "0.9.0" }
thiserror.workspace = true
# Parsing only (ADR 0053): the ring-backed `verify` feature is replaced by the
# first-party signature check in signed_gossip.rs, on the workspace provider.
x509-parser = { workspace = true }
serde.workspace = true
toml.workspace = true
argon2.workspace = true
jsonwebtoken.workspace = true
serde_json.workspace = true
aws-lc-rs = { workspace = true }
# The Authenticator trait is async (ADR 0004 amendment): authentication can be I/O —
# an HTTP hook, LDAP, a remote token introspection endpoint. Already in the tree via
# mqtt-storage / mqtt-cluster / mqttd; not a new supply-chain crate.
async-trait = "0.1"

[dev-dependencies]
rcgen.workspace = true
# The trait is async, so its tests need a runtime — even for verifiers that never await.
tokio = { workspace = true }

[lints]
workspace = true
