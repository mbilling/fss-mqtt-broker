[package]
name = "mqtt-rules"
description = "Rule engine: EMQX-compatible rule SQL evaluated on the publish path (ADR 0083)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
mqtt-core = { path = "../mqtt-core", version = "1.0.0" }
bytes.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
# The rules file is TOML, like every other mqttd policy file (ADR 0046).
toml.workspace = true
# `edit`: one rule changed in place, the rest of the file byte for byte (ADR 0084).
toml_edit.workspace = true
# regex_match / regex_replace / regex_extract. `regex-automata` and `regex-syntax`
# already ship in the broker (tracing-subscriber's env filter), and `regex` itself is
# already in Cargo.lock; default features off keeps aho-corasick out of the binary.
# Linear-time matching is load-bearing: a rule evaluates publisher-controlled
# payloads, so a backtracking engine would be a per-message DoS surface.
regex = { version = "1", default-features = false, features = ["std", "unicode"] }
# base64_encode / base64_decode — already in the shipped graph via reqwest/hyper-util.
base64 = "0.22"
# Date/time functions — already in the shipped graph via openraft (default features).
chrono = "0.4"
# sha / sha256 digests and the uuid/random sources: the workspace's single crypto
# provider (ADR 0053), already linked into the broker.
aws-lc-rs = { workspace = true }

[dev-dependencies]
criterion = { workspace = true }

[lints]
workspace = true

[[bench]]
name = "rules"
harness = false
