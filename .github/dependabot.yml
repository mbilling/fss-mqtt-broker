# ADR 0065 T2: the inbound half of dependency hygiene. The gates (cargo-deny,
# cargo-audit, the full test battery) already refuse bad dependencies; this
# produces the stream of update PRs those gates judge, so a fixed vulnerability
# reaches us by automation rather than by someone noticing an audit failure.
#
# Grouped and weekly on purpose: a PR per patch bump is noise that trains
# reviewers to rubber-stamp. Security updates ignore the schedule and arrive
# immediately (Dependabot's built-in behaviour).
#
# NOT covered here, deliberately:
#   - deploy/ image pins — they advance with OUR release train (RELEASING.md),
#     not with upstream; check-deploy-image-pin.sh gates them.
# Groups carry MINOR + PATCH only. A semver-major arrives as its own PR, alone,
# because a major is an API/behaviour change someone must actually read — the
# first weekly sweep proved it by burying redb 2->4 (the storage engine!) and a
# toml major among 19 routine bumps, breaking three jobs at once.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      rust-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # The storage engine's container format is part of the ADR 0039/0058
      # compatibility contract: a rolling upgrade must reopen stores in BOTH
      # directions, so a redb MAJOR is a broker-MAJOR act (format-compat
      # analysis, migration, BASELINE_REF story) taken deliberately in its own
      # ADR-backed PR — never by sweep. Minors/patches within the major flow.
      - dependency-name: redb
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5

  - package-ecosystem: cargo
    directory: /tools/mqttui
    schedule:
      interval: weekly
      day: monday
    groups:
      mqttui-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    open-pull-requests-limit: 3

  # Fuzz harnesses are separate cargo workspaces with their own lockfiles. They
  # ship nothing, but repository-wide scanners (Scorecard's OSV check) read them,
  # and left alone they go stale: mqtt-auth's sat at jsonwebtoken 9.3.1, inside
  # GHSA-h395-gr6q-cpjc's range, long after the workspace moved to 11.x.
  - package-ecosystem: cargo
    directories:
      - /crates/mqtt-auth/fuzz
      - /crates/mqtt-cluster/fuzz
      - /crates/mqtt-codec/fuzz
    schedule:
      interval: weekly
      day: monday
    groups:
      fuzz-lockfiles:
        patterns: ["*"]
    open-pull-requests-limit: 2

  # Digest-pinned base images of the demo stack (demo/Dockerfile*). After a bump,
  # re-run scripts/vendor-mqttui-examples.sh (CI checks the vendored copy).
  - package-ecosystem: docker
    directory: /demo
    schedule:
      interval: weekly
      day: monday
    groups:
      demo-base-images:
        patterns: ["*"]
    open-pull-requests-limit: 1

  # The interop suite's hash-pinned Python requirements.
  - package-ecosystem: pip
    directory: /scripts/interop
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
