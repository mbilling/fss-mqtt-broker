# The nightly deep tier (ADR 0044 P4): what per-PR minutes cannot buy —
# wide seed sweeps over real processes, the two-binary rolling upgrade,
# an hour-long soak judged on drift watermarks, and fuzz time.
#
# A nightly failure is triaged with the ADR 0042 exhibit-ledger discipline:
# it lands as a row in the ADR 0044 findings ledger (docs/delivery/
# 0044-release-readiness-assurance.md) before it is fixed or waived.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *" # 03:17 UTC daily (off the :00 stampede)
  workflow_dispatch: # and on demand

env:
  CARGO_TERM_COLOR: always

# Least privilege (OpenSSF Scorecard token-permissions): nothing here writes.
permissions:
  contents: read

jobs:
  proc-sweep:
    name: out-of-process seed sweep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # 8 seeds ≈ 8 full spawn/kill/restart schedules (serialized by design).
      - name: cluster_proc sweep
        run: MQTTD_PROC_SEEDS=8 MQTTD_PROC_HISTORY_DIR=$PWD/target/proc-histories cargo test -p mqttd --test cluster_proc -- --nocapture
      # The independent verdict, standalone (issue #231): the same histories every
      # seed already passed in-test, re-checked by the checker BINARY — proving the
      # artifact chain works and archiving what was verified.
      - name: Re-check the recorded histories independently
        run: cargo run -p history-check -- target/proc-histories/*.jsonl
      - name: Archive the checked histories
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: proc-histories
          path: target/proc-histories/
          retention-days: 14

  stress-sweep:
    name: in-process stress sweep
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # The ADR 0042 soak profile: widen the seeded fault schedules.
      - name: cluster_stress sweep
        run: MQTTD_STRESS_SEEDS=8 cargo test -p mqttd --test cluster_stress -- --nocapture

  upgrade:
    name: two-binary rolling upgrade
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the baseline is built from a pinned historic ref
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: rolling upgrade + rollback (ADR 0044 P3)
        run: cargo test -p mqttd --test cluster_upgrade -- --ignored --nocapture

  soak:
    name: one-hour soak (drift watermarks)
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: soak (RSS / FD / p99 drift)
        run: MQTTD_SOAK_SECS=3600 cargo test -p mqttd --test cluster_soak -- --ignored --nocapture

  bench:
    name: hot-path benchmarks (ADR 0044 P6)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # Print current criterion numbers for comparison against
      # docs/benchmarks/BASELINE.md. A meaningful shift is investigated and the
      # baseline updated with the commit that moved it (the per-PR perf_gate
      # test is the automatic floor; this is the human-read record).
      - name: codec + durable-plane + bridge benches
        run: |
          cargo bench -p mqtt-codec --bench codec
          cargo bench -p mqtt-cluster --bench durable_hotpaths
          cargo bench -p mqtt-bridge --bench hotpaths

  fuzz:
    name: fuzz every attacker-reachable parser (ADR 0044 P5)
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false # one target's finding must not hide the others' runs
      matrix:
        include:
          - crate: crates/mqtt-codec
            target: packet_decode # client-facing MQTT packets
          - crate: crates/mqtt-cluster
            target: peer_decode # peer-bus frames
          - crate: crates/mqtt-cluster
            target: swim_message # gossip message body (post-auth)
          - crate: crates/mqtt-cluster
            target: gossip_open # gossip datagram (pre-auth, most exposed)
          - crate: crates/mqtt-auth
            target: crl_parse # CRL DER (operator file, hot-reloaded)
          - crate: crates/mqtt-auth
            target: acl_parse # ACL TOML (operator file, hot-reloaded)
    # libFuzzer needs nightly rustc. PINNED (not floating @nightly): the 2026-07-24+
    # nightlies ICE in codegen ("not immediate: OperandRef(Uninit ...)", a
    # rustc_codegen_ssa bug) while compiling the tokio-runtime types the mqtt-cluster
    # fuzz targets pull in — it broke the nightly tier for 4 nights running. The date
    # lives HERE, once: both the install and the `cargo +<tc>` invocation read it, so
    # they can never drift (a `cargo +nightly` that ignores the dated install is exactly
    # the bug that made the first pin a no-op). Revisit toward floating once upstream
    # fixes the ICE.
    env:
      FUZZ_TOOLCHAIN: nightly-2026-07-22
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ env.FUZZ_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # 12 minutes per target. The first corpus dir (gitignored, ephemeral in
      # CI) is where libFuzzer writes coverage-expanding units; the committed
      # seed corpus is passed read-only as an additional input. A crash writes a
      # fuzz/artifacts/ reproducer and fails the job (see SECURITY.md).
      - name: fuzz ${{ matrix.target }}
        working-directory: ${{ matrix.crate }}
        run: |
          # The working corpus dir is gitignored (ephemeral), so it does not
          # exist in a fresh checkout — and libFuzzer hard-errors on a missing
          # explicit corpus dir ("The required directory ... does not exist").
          mkdir -p fuzz/corpus/${{ matrix.target }}
          # cargo +$FUZZ_TOOLCHAIN (not +nightly): rustup sets RUSTUP_TOOLCHAIN for the
          # inner `cargo build` cargo-fuzz spawns, so the DATED toolchain compiles the
          # target — bypassing the broken floating nightly.
          cargo "+${FUZZ_TOOLCHAIN}" fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=720

  kube-smoke:
    name: kubernetes runtime smoke (kind)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      # ADR 0047 T5: stand up the chart as a real 3-node cluster in kind, prove it forms, drains
      # on scale-down (preStop --decommission), and survives a quorum-safe rolling restart with no
      # durable (retained) state loss. Self-diagnosing on failure (dumps pods + logs).
      - name: kind runtime smoke
        run: ./scripts/k8s/kind-smoke.sh

  operator-e2e:
    name: operator end-to-end (kind)
    runs-on: ubuntu-latest
    # 60, not 45: the run grew from 3 assertions to 9 (RBAC minimality, scale, founder
    # guard, break-glass fence, operator restart mid-incident, leader failover, brownout
    # detection, CR-deletion GC), and several of them wait out real timers — a 30s Lease
    # takeover, a 100-sample stability window, a settle after each roll.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install kind
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1
        with:
          install_only: true
      # ADR 0055 T7: the runtime proof for the reconciler. Creates a cluster from
      # a CR, asserts a routine rolling restart provokes NO fence (the safety
      # property — unreachable pods are absent evidence, not a split brain), then
      # induces a real split brain and asserts it is detected and fenced with the
      # PVC quarantined by label rather than deleted.
      - name: operator e2e
        run: ./scripts/k8s/operator-e2e.sh

  oidc:
    name: OIDC integration (real Keycloak, forced rotation) (ADR 0050 T4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install mosquitto clients
        run: sudo apt-get update && sudo apt-get install -y mosquitto-clients
      # ADR 0050 T4 — the acceptance bar: drive the real mqttd binary against a pinned
      # Keycloak, prove an IdP-minted token authenticates (JWT-in-password bridge), a
      # wrong-audience token is refused, keys ROTATED mid-run are followed WITHOUT a
      # broker restart (unknown-kid refetch), and cached keys survive an IdP outage.
      # docker is preinstalled on ubuntu-latest runners.
      - name: OIDC lifecycle against Keycloak
        run: ./scripts/oidc/run.sh

  msrv:
    name: minimum supported Rust version
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The declared `rust-version` is a PROMISE to anyone pinning an older
    # toolchain, and nothing checked it: every other job runs `stable` or the
    # 1.97.0 reproducibility pin, so "1.88" was an untested claim.
    #
    # It runs nightly rather than per-PR because an MSRV break comes from a
    # dependency bump or a new language feature — rare, and fine to learn about
    # within a day — while the check costs ~20 minutes on a cold cache.
    #
    # rust-toolchain.toml pins 1.97.0 for EVERY cargo invocation in this repo and
    # overrides an installed default: exactly the trap the fuzz job documents
    # ("a `cargo +nightly` that ignores the dated install is exactly the bug that
    # made the first pin a no-op"). RUSTUP_TOOLCHAIN is what beats it — so it is
    # set per step, and the job ASSERTS the version actually in use before
    # checking anything. A verification job silently running the wrong toolchain
    # is worse than no job at all.
    strategy:
      fail-fast: false # each declared MSRV is its own promise; report both
      matrix:
        include:
          - toolchain: "1.88.0"
            args: "--workspace --exclude mqttd-operator"
            why: "the workspace rust-version"
          - toolchain: "1.89.0"
            args: "--workspace"
            why: "mqttd-operator declares 1.89"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master
        with:
          toolchain: ${{ matrix.toolchain }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: the toolchain under test really is ${{ matrix.toolchain }}
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: |
          got="$(rustc --version)"
          echo "$got"
          case "$got" in
            "rustc ${{ matrix.toolchain }}"*) ;;
            *)
              echo "::error title=MSRV job ran the wrong toolchain::expected rustc ${{ matrix.toolchain }}, got '$got' — rust-toolchain.toml won over RUSTUP_TOOLCHAIN"
              exit 1
              ;;
          esac
      - name: cargo check on ${{ matrix.toolchain }} (${{ matrix.why }})
        env:
          RUSTUP_TOOLCHAIN: ${{ matrix.toolchain }}
        run: cargo check ${{ matrix.args }} --all-features

  image-smoke:
    name: container image, as a user runs it
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Every other test drives the BINARY, which left the image itself untested —
    # and the gap was not theoretical. The published v0.9.0-rc image runs as uid
    # 65532 and shipped no directory that uid could write, so durable sessions
    # (the headline feature, ON by default) could not be enabled in a container
    # at all: MQTTD_DATA_DIR=/data, a named volume and a subdirectory all failed
    # with Permission denied. Nothing caught it, because nothing ran the image.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install musl C toolchain + mosquitto clients
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools mosquitto-clients
      - name: image smoke (nonroot data dir, restart durability, read-only rootfs)
        run: ./scripts/image-smoke.sh

      # The cheapest place a real `docker compose up` can live: this job already has the
      # musl toolchain, mosquitto-clients and a built image. It is also the ONLY lane that
      # runs on a native-Linux docker host, which is what proves the staged secrets are
      # readable by uid 65532 — a bind-mounted 0700 ./secrets is untraversable by that uid
      # on Linux and invisibly fine under Docker Desktop's uid mapping. Per-PR CI validates
      # the same file with `docker compose config` but never brings it up (issue #254).
      - name: compose reference deployment (TLS by default, real containers)
        run: ./scripts/compose-smoke.sh

      # Issue #263: the same reference deployment, but resolving compose.yaml's PINNED
      # DEFAULT tag with no override — the reader's exact path, `./bootstrap.sh &&
      # docker compose up -d` against the image users actually pull. This is the lane
      # whose absence let v0.9.0 ship as a default that could never pass its own
      # healthcheck. Skips loudly (never silently green) while the pinned tag is not
      # yet published; the per-PR pin gate proves that state is a forward pin.
      - name: compose reference deployment (the PUBLISHED default image, no override)
        run: MQTTD_SMOKE_DEFAULT_IMAGE=1 ./scripts/compose-smoke.sh
