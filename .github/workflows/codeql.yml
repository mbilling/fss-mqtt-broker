name: CodeQL

# ADR 0069 T2 / ADR 0065 T5 (analysis half): the independent second opinion
# beside clippy, and the whole of the Scorecard SAST check. Rust analysis on
# every PR and main push; findings land in code scanning where the Scorecard
# SARIF already goes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload results to code scanning
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          languages: rust
          build-mode: none
          config-file: ./.github/codeql/codeql-config.yml
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4
        with:
          category: "/language:rust"
