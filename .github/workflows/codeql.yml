name: CodeQL

# ADR 0069 T2 / ADR 0065 T5 (analysis half): the independent second opinion
# beside clippy, and the whole of the Scorecard SAST check. Rust analysis on
# every PR and main push; findings land in code scanning where the Scorecard
# SARIF already goes.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "41 5 * * 2"

permissions:
  contents: read

jobs:
  analyze:
    name: codeql (rust)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      security-events: write # upload results to code scanning
      contents: read
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
      - uses: github/codeql-action/init@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          languages: rust
          build-mode: none
      - uses: github/codeql-action/analyze@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          category: "/language:rust"
