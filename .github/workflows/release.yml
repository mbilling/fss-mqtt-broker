name: Release

# ADR 0045 — a release is a signed, annotated semver tag and NOTHING else drives
# it. Pushing `vX.Y.Z` builds, signs, and publishes reproducible binaries, a
# hardened image, and an SBOM entirely from the tagged commit. Per-PR CI (ci.yml)
# is untouched; this workflow runs only on tags.
on:
  push:
    tags:
      - "v*.*.*"

# Least privilege, granted only where needed:
#   contents: write        — create the GitHub Release and upload assets
#   packages: write        — push the image to GHCR
#   id-token: write        — keyless OIDC signing (cosign) + provenance attestation
#   attestations: write    — record SLSA build-provenance attestations
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # The bridge ships as its OWN image, not a second entrypoint into the broker's
  # (ADR 0025: separate process, separate identity, separate failure domain).
  BRIDGE_IMAGE_NAME: ${{ github.repository }}-bridge

jobs:
  # ── Gate: the release commit must pass the same supply-chain audit CI runs ──
  audit:
    name: supply-chain audit (release commit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install cargo-deny and cargo-audit
        run: |
          cargo install cargo-deny --locked
          cargo install cargo-audit --locked
      - run: cargo deny check
      - run: cargo audit

  # ── Build the reproducible binary + single-arch image, per architecture ──
  build:
    name: build ${{ matrix.target }}
    needs: audit
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            runner: ubuntu-24.04
            arch: amd64
          - target: aarch64-unknown-linux-musl
            runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5

      # rust-toolchain.toml pins the version; install the matching static-musl target.
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.97.0"
          targets: ${{ matrix.target }}
      # musl-tools gives the native-arch `musl-gcc` that aws-lc-rs's C
      # build needs; each arch builds on its own native runner (no cross).
      - name: Install musl C toolchain
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends musl-tools

      - name: Reproducible build
        # mqttui is named explicitly: it lives in its own workspace with its own lockfile
        # (ADR 0056 §1), so it is not part of the default package set.
        run: scripts/release/build-repro.sh ${{ matrix.target }} mqttd mqtt-bridge mqttui

      # Independent proof of byte-reproducibility: fully clean and rebuild from
      # the same tag, then assert the two binaries are identical.
      - name: Verify reproducibility (clean rebuild is byte-identical)
        run: |
          # EVERY shipped binary must be reproducible, not just the broker's — a signature
          # over a binary nobody can regenerate proves less. mqttui's artefacts live under
          # its own workspace, so its path differs from the other two.
          paths() {
            echo "target/${{ matrix.target }}/release/mqttd"
            echo "target/${{ matrix.target }}/release/mqtt-bridge"
            echo "tools/mqttui/target/${{ matrix.target }}/release/mqttui"
          }
          paths | while read -r b; do
            sha256sum "$b" | awk '{print $1}' >> first.sha256
          done
          # BOTH workspaces must be cleaned. `cargo clean` at the root does not touch
          # tools/mqttui/target, so leaving it would re-checksum the very same file and the
          # comparison would pass without a rebuild having happened — a check that cannot
          # fail is worse than no check, because it reports the property it never tested.
          cargo clean
          cargo clean --manifest-path tools/mqttui/Cargo.toml
          for b in $(paths); do
            if [ -e "$b" ]; then
              echo "::error title=Reproducibility::$b survived the clean, so the rebuild below would not be a rebuild"
              exit 1
            fi
          done
          scripts/release/build-repro.sh ${{ matrix.target }} mqttd mqtt-bridge mqttui
          paths | while read -r b; do
            sha256sum "$b" | awk '{print $1}' >> second.sha256
          done
          if ! diff -q first.sha256 second.sha256; then
            echo "::error title=Reproducibility::rebuild of the tag was not byte-identical"
            paste first.sha256 second.sha256
            exit 1
          fi
          echo "reproducible:"; paste <(printf 'mqttd\nmqtt-bridge\nmqttui\n') first.sha256

      - name: Stage artifact + checksum
        id: stage
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="mqttd-${VERSION}-${{ matrix.target }}"
          BRIDGE_NAME="mqtt-bridge-${VERSION}-${{ matrix.target }}"
          UI_NAME="mqttui-${VERSION}-${{ matrix.target }}"
          mkdir -p dist out
          cp "target/${{ matrix.target }}/release/mqttd" "out/${NAME}"
          cp "target/${{ matrix.target }}/release/mqtt-bridge" "out/${BRIDGE_NAME}"
          # mqttui ships as a signed binary but NOT in the container image: it is a terminal
          # UI for a human at a keyboard, and adding a TUI to the broker image would grow
          # the runtime attack surface for something nothing in the image can use.
          cp "tools/mqttui/target/${{ matrix.target }}/release/mqttui" "out/${UI_NAME}"
          # The container images copy from dist/<binary> (arch-native).
          cp "target/${{ matrix.target }}/release/mqttd" dist/mqttd
          cp "target/${{ matrix.target }}/release/mqtt-bridge" dist/mqtt-bridge
          ( cd out && sha256sum "${NAME}" > "${NAME}.sha256" )
          ( cd out && sha256sum "${BRIDGE_NAME}" > "${BRIDGE_NAME}.sha256" )
          ( cd out && sha256sum "${UI_NAME}" > "${UI_NAME}.sha256" )
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"
          echo "bridge_name=${BRIDGE_NAME}" >> "$GITHUB_OUTPUT"
          echo "ui_name=${UI_NAME}" >> "$GITHUB_OUTPUT"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      # SLSA build provenance for the binary — what commit/workflow produced it.
      - name: Attest binary provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            out/${{ steps.stage.outputs.name }}
            out/${{ steps.stage.outputs.bridge_name }}
            out/${{ steps.stage.outputs.ui_name }}

      - name: Upload binary artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.arch }}
          path: out/*
          retention-days: 7

      # ── Single-arch image, pushed by digest to GHCR ──
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3
      - name: Build and push single-arch image by digest
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.stage.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      # Hand the per-arch digest to the release job via an artifact. (Matrix job
      # outputs are last-writer-wins across legs, so they cannot carry one value
      # per arch — a file-per-arch artifact is the correct handoff.)
      - name: Build and push single-arch BRIDGE image by digest
        id: push_bridge
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.bridge
          platforms: linux/${{ matrix.arch }}
          build-args: |
            VCS_REF=${{ github.sha }}
            VERSION=${{ steps.stage.outputs.version }}
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
      - name: Record image digests
        run: |
          mkdir -p digests bridge-digests
          echo "${{ steps.push.outputs.digest }}" > "digests/${{ matrix.arch }}"
          echo "${{ steps.push_bridge.outputs.digest }}" > "bridge-digests/${{ matrix.arch }}"
      - name: Upload image digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: digests/${{ matrix.arch }}
          retention-days: 7
      - name: Upload bridge image digest
        uses: actions/upload-artifact@v4
        with:
          name: bridge-digest-${{ matrix.arch }}
          path: bridge-digests/${{ matrix.arch }}
          retention-days: 7

  # ── Assemble the multi-arch manifest, SBOM, signatures, and the Release ──
  release:
    name: sign + publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: sigstore/cosign-installer@v3
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@v3

      - name: Set version
        id: v
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # A pre-release tag (contains a hyphen, e.g. 0.1.0-rc.1) is NOT `latest`.
          if [[ "${VERSION}" == *-* ]]; then echo "prerelease=true" >> "$GITHUB_OUTPUT";
          else echo "prerelease=false" >> "$GITHUB_OUTPUT"; fi

      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          path: assets
          merge-multiple: true
      - name: Download image digests
        uses: actions/download-artifact@v4
        with:
          pattern: digest-*
          path: digests
          merge-multiple: true
      - name: Download bridge image digests
        uses: actions/download-artifact@v4
        with:
          pattern: bridge-digest-*
          path: bridge-digests
          merge-multiple: true

      # ── Multi-arch manifest from the per-arch digests pushed by `build` ──
      - name: Create and push multi-arch manifest
        id: manifest
        run: |
          IMAGE="${REGISTRY}/${IMAGE_NAME}"
          TAGS=(--tag "${IMAGE}:${{ steps.v.outputs.version }}")
          if [[ "${{ steps.v.outputs.prerelease }}" == "false" ]]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi
          REFS=()
          for f in digests/*; do
            REFS+=("${IMAGE}@$(cat "$f")")
          done
          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "::error title=Manifest::no per-arch digests found"; exit 1
          fi
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.v.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      - name: Create and push multi-arch BRIDGE manifest
        id: bridge_manifest
        run: |
          IMAGE="${REGISTRY}/${BRIDGE_IMAGE_NAME}"
          TAGS=(--tag "${IMAGE}:${{ steps.v.outputs.version }}")
          if [[ "${{ steps.v.outputs.prerelease }}" == "false" ]]; then
            TAGS+=(--tag "${IMAGE}:latest")
          fi
          REFS=()
          for f in bridge-digests/*; do
            REFS+=("${IMAGE}@$(cat "$f")")
          done
          if [ "${#REFS[@]}" -eq 0 ]; then
            echo "::error title=Manifest::no per-arch bridge digests found"; exit 1
          fi
          docker buildx imagetools create "${TAGS[@]}" "${REFS[@]}"
          DIGEST="$(docker buildx imagetools inspect "${IMAGE}:${{ steps.v.outputs.version }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"

      # ── SBOM: CycloneDX for the broker binary, from the locked source graph ──
      - name: Generate CycloneDX SBOM
        run: |
          cargo install cargo-cyclonedx --locked
          # Emit per-crate SBOMs (each the crate's transitive graph, as pinned by
          # Cargo.lock). cargo-cyclonedx writes <package>.cdx.json next to each
          # crate manifest; we ship the mqttd binary's as the headline SBOM.
          # NOTE: `cargo cyclonedx` rejects cargo's `--locked` flag (v0.5.9:
          # "unexpected argument") — lockfile discipline is asserted by the
          # diff guard below instead.
          cargo cyclonedx --format json
          git diff --exit-code Cargo.lock || {
            echo "::error title=SBOM::SBOM generation mutated Cargo.lock (resolution drifted from the tagged lockfile)"; exit 1;
          }
          mkdir -p assets
          # One SBOM per shipped binary: each carries only ITS transitive graph,
          # so the bridge's SBOM does not imply the broker's dependencies are in
          # the bridge image, or vice versa.
          for pair in "mqttd:sbom" "mqtt-bridge:sbom-bridge"; do
            crate="${pair%%:*}"; out="${pair##*:}"
            SBOM="$(find . -name "${crate}.cdx.json" -print -quit)"
            if [ -z "$SBOM" ]; then
              echo "::error title=SBOM::cargo-cyclonedx produced no ${crate}.cdx.json"; exit 1
            fi
            cp "$SBOM" "assets/${out}-${{ steps.v.outputs.version }}.cdx.json"
            echo "SBOM: $SBOM -> ${out}-${{ steps.v.outputs.version }}.cdx.json ($(wc -c < "$SBOM") bytes)"
          done

          # mqttui is a SEPARATE workspace with its own lockfile (ADR 0056 §1), so the run
          # above cannot see it — its graph is deliberately not in the broker's. It is a
          # published, signed artifact, so by ADR 0045's own standard it gets an SBOM too,
          # cut from ITS lockfile.
          cargo cyclonedx --format json --manifest-path tools/mqttui/Cargo.toml
          git diff --exit-code tools/mqttui/Cargo.lock || {
            echo "::error title=SBOM::mqttui SBOM generation mutated tools/mqttui/Cargo.lock"; exit 1;
          }
          UI_SBOM="$(find tools/mqttui -name 'mqttui.cdx.json' -print -quit)"
          if [ -z "$UI_SBOM" ]; then
            echo "::error title=SBOM::cargo-cyclonedx produced no mqttui.cdx.json"; exit 1
          fi
          cp "$UI_SBOM" "assets/sbom-mqttui-${{ steps.v.outputs.version }}.cdx.json"
          echo "SBOM: $UI_SBOM -> sbom-mqttui-${{ steps.v.outputs.version }}.cdx.json ($(wc -c < "$UI_SBOM") bytes)"

      # ── Keyless signatures (cosign) over every release asset ──
      - name: Sign binaries, checksums, and SBOM (keyless)
        env:
          COSIGN_YES: "true"
        run: |
          cd assets
          for f in *; do
            [ -f "$f" ] || continue
            case "$f" in *.sig|*.pem) continue;; esac
            cosign sign-blob --yes "$f" \
              --output-signature "${f}.sig" \
              --output-certificate "${f}.pem"
          done

      # ── Sign the image and attest its provenance ──
      - name: Sign image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${{ steps.manifest.outputs.digest }}"
      - name: Attest image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          push-to-registry: true
      - name: Attest image SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          subject-digest: ${{ steps.manifest.outputs.digest }}
          sbom-path: assets/sbom-${{ steps.v.outputs.version }}.cdx.json
          push-to-registry: true

      # The bridge image gets the same treatment — an unsigned second image would
      # be the weak link in a supply chain the broker image takes seriously.
      - name: Sign bridge image (keyless)
        env:
          COSIGN_YES: "true"
        run: cosign sign --yes "${REGISTRY}/${BRIDGE_IMAGE_NAME}@${{ steps.bridge_manifest.outputs.digest }}"
      - name: Attest bridge image provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE_NAME }}
          subject-digest: ${{ steps.bridge_manifest.outputs.digest }}
          push-to-registry: true
      - name: Attest bridge image SBOM
        uses: actions/attest-sbom@v2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ env.BRIDGE_IMAGE_NAME }}
          subject-digest: ${{ steps.bridge_manifest.outputs.digest }}
          sbom-path: assets/sbom-bridge-${{ steps.v.outputs.version }}.cdx.json
          push-to-registry: true

      # ── Publish the GitHub Release with all verifiable assets ──
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.v.outputs.version }}
          IMG_DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          {
            printf 'Reproducible, signed release of mqttd %s.\n\n' "$VERSION"
            printf '**Image:** `%s/%s:%s`\n' "$REGISTRY" "$IMAGE_NAME" "$VERSION"
            printf '(digest `%s`)\n\n' "$IMG_DIGEST"
            printf 'Every asset below is cosign-signed (keyless, transparency-logged)\n'
            printf 'and the binaries are byte-reproducible from this tag. See\n'
            printf 'RELEASING.md for the one-command verify path.\n'
          } > release-notes.md
          PRERELEASE_FLAG=""
          [[ "${{ steps.v.outputs.prerelease }}" == "true" ]] && PRERELEASE_FLAG="--prerelease"
          gh release create "${GITHUB_REF_NAME}" \
            --title "mqttd ${VERSION}" \
            --notes-file release-notes.md \
            ${PRERELEASE_FLAG} \
            assets/*
