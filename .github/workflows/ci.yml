name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

# Least privilege (OpenSSF Scorecard token-permissions): nothing here writes.
permissions:
  contents: read

jobs:
  # ── What changed? Docs-only diffs skip the build/test lanes (ADR-free
  # plumbing): a change touching ONLY prose (root *.md, docs/** except the
  # gate-input test-inventory, .github markdown) needs the docs gates, not a
  # 25-minute pipeline. Jobs skipped by this condition report conclusion
  # `skipped`, which SATISFIES the main ruleset's required checks — unlike
  # workflow-level path filters, which would leave required checks missing and
  # block the merge. Fail-open: any ambiguity (odd event shape, rename, empty
  # diff) counts as code.
  changes:
    name: what changed
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.diff.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: diff
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            BASE="${{ github.event.pull_request.base.sha }}"
          else
            BASE="${{ github.event.before }}"
          fi
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE" 2>/dev/null; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "no usable base — fail open"; exit 0
          fi
          FILES=$(git diff --name-only "$BASE"...HEAD || true)
          if [ -z "$FILES" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"; echo "empty diff — fail open"; exit 0
          fi
          echo "$FILES"
          CODE=false
          while IFS= read -r f; do
            case "$f" in
              docs/test-inventory.md) CODE=true; break ;;      # a gate INPUT, not prose
              docs/*) ;;                                        # prose
              *.md) case "$f" in */*) CODE=true; break ;; *) ;; esac ;;  # root-level .md only
              .github/*.md|.github/ISSUE_TEMPLATE/*) ;;         # templates/prose
              LICENSE) ;;
              *) CODE=true; break ;;
            esac
          done <<< "$FILES"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "verdict: code=$CODE"

  test:
    name: build, test, lint
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Hard ceiling ~3x the normal duration: a hung apt mirror once held this
    # workflow's default 6-hour leash (2026-08-18); no job gets that again.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Format
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features
      - name: Test
        shell: bash
        run: |
          # Run every test (no fail-fast so all failures surface at once), tee the
          # output, then re-emit failing test names and panic sites as ::error::
          # annotations. Annotations are visible in the run UI and via the check-run
          # annotations API without repo-admin access, so a flaky failure is
          # diagnosable from the API alone.
          set +e
          cargo test --all --no-fail-fast 2>&1 | tee test-output.txt
          code=${PIPESTATUS[0]}
          if [ "$code" -ne 0 ]; then
            grep -E '^test .+ \.\.\. FAILED' test-output.txt | sort -u \
              | sed 's/^/::error title=Test failed::/' || true
            # A Rust panic prints the LOCATION on one line and the MESSAGE on the
            # next, so grepping 'panicked at' alone annotates where it blew up and
            # silently drops why — which is the half that makes a flake diagnosable
            # (our harnesses put the failure reason, the repro seed and the schedule
            # trace in the message). Join the two.
            awk '/panicked at /{loc=$0; if ((getline msg) > 0) print loc " " msg; else print loc}' \
              test-output.txt | sort -u | head -n 20 \
              | sed 's/^/::error title=Panic::/' || true
          fi
          exit "$code"
      # Issue #260: `cargo test` cannot report a test that is NOT THERE. A `#[cfg]` that
      # excluded it, a file that compiled to zero tests, a deletion inside a large diff — each
      # leaves a green run over a smaller suite, and no rule over source text sees that
      # reliably. This compares the tests the binaries actually contain against a checked-in
      # inventory (regenerate with `check-test-hygiene.py --write-inventory`).
      - name: The test binaries contain the tests the inventory says they do
        run: python3 scripts/check-test-hygiene.py --check-inventory --only root
      # And the tests that actually RAN AND PASSED are those same ones. `#[ignore]` removes a
      # test from every run while the binary still lists it, and one `std::process::exit(0)`
      # inside a test discards EVERY result in its binary — `running 6 tests` and then no
      # summary at all, with `cargo test` exiting 0. Both are invisible above and obvious in the
      # log the step above already tee'd, so this reads that log rather than re-running anything.
      - name: The tests that ran and passed are the ones the inventory accounts for
        run: python3 scripts/check-test-hygiene.py --check-results test-output.txt --only root

  fips:
    name: fips variant (compile + posture tests)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # ADR 0068 T3: an untested variant is a liability with a certificate on it.
    # Per-PR: the whole graph compiles in fips mode and the posture tests run
    # (provider IS the validated module, non-approved algorithms absent, the
    # TLS 1.2 opt-in refused). The nightly tier runs protocol suites against
    # the fips binary. Toolchain: aws-lc-fips-sys needs cmake + Go, both on
    # the runner image.
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          key: fips
      - name: fips graph compiles
        run: cargo check -p mqttd --features fips --all-targets
      - name: fips posture tests
        run: cargo test -p mqtt-net --lib --features fips

  docs:
    name: delivery dashboard
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Status dashboard is up to date
        run: python3 scripts/gen-status.py --check
      # ADR 0051 T1: the README's counts and crate list are derivable from the
      # tree, so they must not be able to drift from it silently — they had,
      # in both directions, before this ran.
      - name: README states derivable facts correctly
        run: python3 scripts/check-readme-facts.py
      # A reason code the broker can emit but no test provokes is a reason code
      # nobody has ever seen it send. Twelve of thirteen were unaudited before
      # this ran; the script explains any exemption it is carrying.
      - name: Every emittable reason code has a test that provokes it
        run: python3 scripts/check-reason-codes.py
      # Issue #260: a test that returns early instead of asserting, and a wall-clock sleep that
      # is not a bounded poll, are the two ways this suite silently stops testing — and neither
      # shows up in a `cargo test` result. Both are build failures now.
      - name: Test hygiene (no naked sleeps, no silent self-skips)
        run: python3 scripts/check-test-hygiene.py
      # The gate's own rules, against fixtures. Every defect this gate shipped with was a
      # BOUNDARY — a rule that fired on prose, a check that read its own source as evidence —
      # and a boundary is invisible from the rule's code and obvious from an input it gets
      # wrong. Each fixture is a pair: an input the rule must flag and the nearest one it must
      # not. Runs before the gate itself would be trusted on real source.
      - name: The hygiene gate's rules still draw the lines they document
        run: python3 scripts/check-test-hygiene.py --self-test
      # The scale rig's knee detection turns on one division. emqtt-bench counts a QoS 0
      # publish twice, so reading its `pub` counter raw doubled the offered rate and marked
      # every QoS 0 $share rung unsustained. Synthesized logs, no cluster, no cost.
      - name: The scale summarizer still corrects emqtt-bench's publish double-count
        run: python3 bench/scale/summarize-curve.py --self-test

  interop:
    name: foreign-client interop (mosquitto + paho)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      # ADR 0034 / ADR 0044 P7: drive the real mqttd binary with TWO independent
      # non-Rust clients (Eclipse Mosquitto CLI + Eclipse Paho Python). Both are
      # external processes, not cargo deps — no addition to the broker's supply chain.
      - name: Install mosquitto clients
        # Bounded apt: the Azure mirror has hung this job twice (2026-08-18/19,
        # each time saved only by the job leash). Retries + per-connection
        # timeouts turn a dead mirror into a fast fallback instead of a stall.
        run: |
          # DPkg::Lock::Timeout bounds the OTHER hang mode: apt silently waiting
          # on the dpkg lock a boot-time unattended-upgrades run still holds.
          APT="-o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=120"
          sudo apt-get $APT update && sudo apt-get $APT install -y mosquitto-clients
      - name: Install Paho
        run: python3 -m pip install --quiet paho-mqtt
      - name: Build broker
        run: cargo build --quiet -p mqttd
      - name: Interop conformance (mosquitto)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/interop/run.sh
      - name: Interop conformance (paho — reason codes, properties, session, capability advertisement)
        run: |
          PORT=$(python3 -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()")
          HPORT=$(python3 -c "import socket;s=socket.socket();s.bind(('127.0.0.1',0));print(s.getsockname()[1]);s.close()")
          MQTTD_PLAINTEXT_BIND=127.0.0.1:$PORT MQTTD_ALLOW_ANONYMOUS=1 \
            MQTTD_ALLOW_EPHEMERAL_DURABILITY=1 \
            MQTTD_HEALTH_BIND=127.0.0.1:$HPORT RUST_LOG=off target/debug/mqttd &
          for _ in $(seq 1 100); do curl -fsS http://127.0.0.1:$HPORT/readyz >/dev/null 2>&1 && break; sleep 0.1; done
          MQTT_PORT=$PORT python3 scripts/interop/paho_conformance.py
      # The INDEPENDENT oracle: Eclipse's own MQTT 5 conformance suite, pinned, driving
      # the real binary. Our tests share this implementation's reading of the spec; this
      # one does not. Its five non-passing tests are declared in the script with reasons,
      # and it fails BOTH ways — on a new failure and on a declared one that starts
      # passing — so the list cannot become an ignore list.
      - name: Interop conformance (eclipse/paho.mqtt.testing — independent MQTT 5 oracle)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/interop/paho-testing.sh
      # ADR 0051 T6: the migration converter's output must be accepted by the real
      # broker, not merely well-formed. A migration tool that emits plausible TOML
      # the broker then rejects burns the evaluation it exists to enable.
      - name: Mosquitto migration converter (output boots the broker)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/migrate/test-from-mosquitto.sh

      # ADR 0051 T7/T17: the same bar for the EMQX and HiveMQ converters, plus the two
      # assertions the Mosquitto harness never made — `mqttd --check-config` on the
      # converted config (ADR 0051 §3's third rule) and expected-TODO-marker greps, so a
      # mapping that quietly stopped emitting cannot pass. The EMQX lane also needs
      # mqtt-bridge, because its bridge output is validated by the real bridge binary.
      - name: Build mqtt-bridge (the EMQX converter's bridge output is validated by it)
        run: cargo build --quiet -p mqtt-bridge
      - name: EMQX migration converter (output validates, boots the broker, bridges)
        run: |
          MQTTD_BIN=target/debug/mqttd MQTT_BRIDGE_BIN=target/debug/mqtt-bridge \
            ./scripts/migrate/test-from-emqx.sh
      - name: HiveMQ migration converter (output validates and boots the broker)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/migrate/test-from-hivemq.sh

      # ADR 0051 T18: docs/MIGRATION.md's dual-run cutover playbook is only worth having if
      # its bridge config actually works, so the document's own shape is run against mqttd +
      # mqtt-bridge + a REAL third-party broker. Needs the mosquitto BROKER, not just the
      # clients this job already installs; the script exits 2 (not 1) if it is missing.
      - name: Install the mosquitto broker (incumbent stand-in for the cutover smoke)
        run: |
          sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=15 -o Acquire::https::Timeout=15 -o DPkg::Lock::Timeout=120 install -y mosquitto
          sudo systemctl stop mosquitto || true
      - name: Dual-run cutover smoke (mqttd <-> Mosquitto through mqtt-bridge)
        run: |
          MQTTD_BIN=target/debug/mqttd MQTT_BRIDGE_BIN=target/debug/mqtt-bridge \
            ./scripts/migrate/dual-run-smoke.sh

      # Issue #297: the converters' SEMANTIC oracle — real mosquitto on the source
      # config vs mqttd on the converted one, seven observable verdicts diffed.
      # The provenance gate kills fabrication; only a differential run can catch a
      # key meaning something other than what the converter took it to mean.
      # Reuses the mosquitto broker installed for the cutover smoke above.
      - name: Migration differential (mosquitto vs mqttd on the converted config)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/migrate/differential-mosquitto.sh

      - name: Quickstart smoke (the README's own two-node cluster)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/quickstart-smoke.sh

      # ADR 0063 / issue #251: docs/INTEGRATION.md is the rule-engine replacement
      # story, and its load-bearing claims (`$share` single delivery incl. a 3.1.1
      # member, retained skipping shared subscriptions, in-order queue-while-down
      # replay) are documented recipes — so they are executed, not trusted.
      - name: Integration blueprint smoke (docs/INTEGRATION.md's external-consumer pattern)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/integration-consumer-smoke.sh

      # ADR 0047 T9: the non-Kubernetes reference deployment, actually booted. Reads the
      # values out of deploy/systemd/mqttd.env.example, so a renamed setting in the shipped
      # artifact fails here instead of on somebody's first install. The runner has both
      # `docker compose` and `systemd-analyze`, so the compose file and the unit are
      # validated with their own tools in the same run.
      - name: Deployment smoke (compose + systemd reference deployment)
        run: MQTTD_BIN=target/debug/mqttd ./scripts/deploy-smoke.sh

      # Issue #263: the compose artifacts default to a PINNED image tag, and every mqttd
      # flag they hand that image must exist in the binary at that tag — the skew that
      # shipped a healthcheck no published image could pass. Tags are fetched explicitly
      # because checkout@v5 clones tagless, and without them the released-tag branch of
      # the gate would silently never engage.
      - name: Deploy artifacts match their pinned image tag
        run: |
          git fetch --tags --force --quiet
          ./scripts/check-deploy-image-pin.sh

  mqttui:
    name: mqttui (separate workspace)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: tools/mqttui
      # ADR 0056 §1: mqttui is its OWN workspace with its OWN lockfile, so ratatui and
      # crossterm can never enter the broker's dependency graph — the one cargo-deny and
      # cargo-audit gate and the SBOM is cut from. It is built and linted here, and never
      # from the root workspace.
      - name: Format
        run: cargo fmt --all --manifest-path tools/mqttui/Cargo.toml -- --check
      - name: Clippy
        run: cargo clippy --manifest-path tools/mqttui/Cargo.toml --all-targets -- -D warnings
      # ADR 0056 §3: the completeness guard. A launcher that silently shows a subset of the
      # scripts becomes the list people trust, so an executable — or merely present —
      # script that nobody declared fails the build here.
      # python3 is on the runner, so the differential test in tools/mqttui/tests/ actually
      # compares the Rust converter against the Python one rather than skipping (ADR 0056
      # T10: two converters that disagree are worse than one).
      - name: Test (manifest completeness guard + the converter differential)
        run: cargo test --manifest-path tools/mqttui/Cargo.toml
      # The other half of the test inventory (issue #260): mqttui is a separate workspace, so
      # its test binaries are listed in the job that builds them.
      - name: The test binaries contain the tests the inventory says they do
        run: python3 scripts/check-test-hygiene.py --check-inventory --only mqttui
      - name: The tests that ran and passed are the ones the inventory accounts for
        run: python3 scripts/check-test-hygiene.py --check-results --only mqttui
      - name: The manifest covers every script
        run: cargo run --quiet --manifest-path tools/mqttui/Cargo.toml -- --check
      # tools/mqttui/bundle/ is a GENERATED copy of demo/, deploy/, scripts/migrate/ and
      # scripts/k8s/, and it is what a `cargo install mqttui` user actually gets. Shipping a
      # stale copy would hand them a different demo from the one in this repository, so the
      # copy is checked here rather than trusted.
      - name: The vendored example bundle is current
        run: scripts/vendor-mqttui-examples.sh --check
      # ADR 0056 T9: mqttui is published to crates.io. `cargo package` includes only files
      # beneath the package root, which is exactly how the first attempt produced a crate
      # that built from a checkout and could not compile once published. This packs the
      # crate and BUILDS it from the tarball, so that cannot reach the registry.
      - name: The crate can actually be published
        run: cargo publish --dry-run --manifest-path tools/mqttui/Cargo.toml

  supply-chain:
    name: supply-chain audit
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6c977a6ca4077a0ceb28ffbe03f59d46e9ac8772 # master; `with:` selects the toolchain
        with:
          toolchain: stable
      - name: Install cargo-deny
        run: cargo install cargo-deny --locked
      - name: cargo-deny
        run: cargo deny check
      - name: Install cargo-audit
        run: cargo install cargo-audit --locked
      - name: cargo-audit
        run: cargo audit

  helm:
    name: helm chart (lint + template + kubeconform)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job compiles two crates (mqttd for --check-config, mqttd-operator for
      # the ADR 0055 T2 render-parity gate) — cache them like the other Rust jobs.
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
      - name: Install helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v3.16.3
      - name: Install kubeconform
        run: |
          curl -fsSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo mv kubeconform /usr/local/bin/
      # ADR 0047: the chart is our operator contract; lint it, render it (default + a bounded
      # single-node override), and schema-validate every rendered manifest. Renders offline — no
      # cluster needed. The kind/k3d runtime smoke (T5) lives in the nightly tier.
      - name: helm lint
        run: helm lint deploy/helm/mqttd
      - name: helm template + kubeconform (defaults)
        run: |
          helm template mqttd deploy/helm/mqttd | tee /tmp/rendered.yaml | \
            kubeconform -strict -summary -ignore-missing-schemas \
              -schema-location default \
              -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json'
      - name: helm template + kubeconform (single-node, PDB off)
        run: |
          helm template mqttd deploy/helm/mqttd \
            --set replicaCount=1 --set podDisruptionBudget.enabled=false \
            --set persistence.enabled=false | \
            kubeconform -strict -summary -ignore-missing-schemas -schema-location default
      # ADR 0025 T12: the bridge is opt-in, and when enabled every client_id must
      # be per-replica — replicas sharing one take over each other's MQTT session,
      # turning the shared-subscription HA pair into a reconnect loop.
      - name: Bridge chart (opt-in, per-replica client id, schema)
        run: ./scripts/k8s/check-bridge-chart.sh
      # ADR 0055 T8 (issue #252): the operator's install chart — lint, render with the
      # CRD included, schema-validate. The CRD's content is separately schema-pinned by
      # the mqttd-operator golden tests (the chart copy must be byte-identical to the
      # generated schema); kubeconform has no CRD meta-schema, so it skips that one
      # document and validates the rest.
      - name: Operator chart (lint + template + kubeconform)
        run: |
          helm lint deploy/helm/mqttd-operator
          helm template mqttd-operator deploy/helm/mqttd-operator --include-crds | \
            kubeconform -strict -summary -ignore-missing-schemas -schema-location default

      # ADR 0055 T2: the operator and the chart must render the SAME objects. Two
      # supported deployment paths that disagree are worse than one, so this diffs
      # them for equivalent inputs and fails on any load-bearing divergence.
      - name: Render parity (operator vs chart)
        run: ./scripts/k8s/render-parity.sh
      # Issue #262 (0047-T10): the chart's CLUSTER BUS, with peerTls actually set. Runs
      # the SHIPPED bootstrap.sh mint, checks every leaf's CN against the pod names the
      # chart renders and its SAN against the advertise host the chart's own init script
      # computes, asserts the render CONSUMES the Secret it mounts (per-pod
      # MQTTD_PEER_TLS_* paths), boots a real broker on a minted leaf, and requires the
      # original unusable certificate to be refused. The bus used to be exercised by
      # nothing at either tier, which is how it shipped broken.
      - name: Cluster-bus PKI + wiring (peerTls ON)
        run: ./scripts/k8s/peer-tls-check.sh
      # The rendered per-pod config template must itself be valid input to --check-config once its
      # placeholders are filled — a quick shell-level render mirrors the init container.
      - name: Rendered config is check-config-valid
        run: |
          helm template mqttd deploy/helm/mqttd \
            | awk '/mqttd.toml.tmpl: \|-/{f=1;next} f&&/^    /{sub(/^    /,"");print;next} f{exit}' \
            | sed -e 's/__NODE_ID__/mqttd-0/g' -e 's/__SEEDS__//g' \
                  -e 's|__PEER_ADVERTISE__|mqttd-0.mqttd-headless.default.svc.cluster.local:7001|g' \
                  -e 's/__READY_MIN__/1/g' > /tmp/rendered.toml
          echo "--- rendered founder config ---"; cat /tmp/rendered.toml
          cargo build --quiet -p mqttd
          target/debug/mqttd --check-config --config /tmp/rendered.toml
