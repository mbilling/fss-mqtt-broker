name: OpenSSF Scorecard

# ADR 0065 T1: the checklist enterprise OSS-intake tooling actually runs, run by
# us first. Results publish to the OpenSSF API (the README badge) and to code
# scanning as SARIF, so a regression in any checked practice is visible where
# maintainers already look.
on:
  schedule:
    - cron: "26 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      # Needed to upload the SARIF results to code scanning.
      security-events: write
      # Needed to publish results to the OpenSSF REST API (the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the badge live and the results auditable
          # by anyone — the point of the exercise.
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4
        with:
          sarif_file: results.sarif
