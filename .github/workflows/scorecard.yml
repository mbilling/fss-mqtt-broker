name: OpenSSF Scorecard

# ADR 0065 T1: the checklist enterprise OSS-intake tooling actually runs, run by
# us first. Results publish to the OpenSSF API (the README badge) and to code
# scanning as SARIF, so a regression in any checked practice is visible where
# maintainers already look.
on:
  schedule:
    - cron: "26 4 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: scorecard analysis
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      # Needed to upload the SARIF results to code scanning.
      security-events: write
      # Needed to publish results to the OpenSSF REST API (the badge).
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@23f22cd43608bae7a1f1fa2603d7314dee9538a5 # v2.6.0
        with:
          results_file: results.sarif
          results_format: sarif
          # Publishing is what makes the badge live and the results auditable
          # by anyone — the point of the exercise.
          publish_results: true
      - name: Upload to code scanning
        uses: github/codeql-action/upload-sarif@1bd86f2fdb4b86187fa4059f16f31a3202acc9ea # v4
        with:
          sarif_file: results.sarif
