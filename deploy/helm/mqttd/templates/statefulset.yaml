apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "mqttd.fullname" . }}
  labels:
    {{- include "mqttd.labels" . | nindent 4 }}
spec:
  # Headless service backs stable per-pod DNS and gossip discovery (ADR 0016).
  serviceName: {{ include "mqttd.headlessName" . }}
  replicas: {{ .Values.replicaCount }}
  # One pod at a time, in order — ADR 0039's rolling-upgrade motion (a pod rejoins and reaches
  # its caught-up watermark before the next rolls).
  podManagementPolicy: OrderedReady
  updateStrategy:
    type: RollingUpdate
  selector:
    matchLabels:
      {{- include "mqttd.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mqttd.labels" . | nindent 8 }}
        {{- with .Values.podLabels }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      annotations:
        # Re-render + roll pods when the config template changes.
        checksum/config: {{ .Values.config | sha256sum }}
        {{- if .Values.metrics.podAnnotations }}
        prometheus.io/scrape: "true"
        prometheus.io/port: "8080"
        prometheus.io/path: "/metrics"
        {{- end }}
        {{- with .Values.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ include "mqttd.serviceAccountName" . }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      # Cover the ADR 0043 decommission drain + ADR 0019 graceful shutdown before a hard kill.
      terminationGracePeriodSeconds: {{ .Values.terminationGracePeriodSeconds }}
      initContainers:
        # 1) Render the per-pod config: node id = the stable pod name; seeds = the first TWO
        #    stable ordinals for joiners (so a pod-0 outage does not block new pods joining),
        #    empty for pod-0 (which founds the lease group); readiness floor = 1 for the
        #    founder (ordered bring-up must let it come Ready alone) and a MAJORITY of the
        #    replica count for every joiner (a minority pod stays out of rotation). The broker
        #    image is distroless (no shell), so this tiny POSIX-shell step does the templating.
        - name: render-config
          {{- if .Values.initImage.digest }}
          image: "{{ .Values.initImage.repository }}@{{ .Values.initImage.digest }}"
          {{- else }}
          image: "{{ .Values.initImage.repository }}:{{ .Values.initImage.tag }}"
          {{- end }}
          imagePullPolicy: {{ .Values.initImage.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -eu
              ORD="${POD_NAME##*-}"
              STS="${POD_NAME%-*}"
              # The cluster-bus certificate is PER POD (issue #262): the bus binds node
              # identity to the certificate's Subject CN, so one leaf shared by every pod
              # drops every peer link. The Secret therefore carries one leaf per node id,
              # keyed by pod name — and an ordinal with no leaf is a scale-up that outran
              # its PKI. Fail HERE, naming the fix, rather than let the broker crash-loop
              # on an unreadable path or (worse) form no mesh while looking healthy.
              if [ -n "${PEER_TLS_DIR:-}" ]; then
                for f in "${POD_NAME}.crt" "${POD_NAME}.key" "ca.crt"; do
                  if [ ! -s "${PEER_TLS_DIR}/${f}" ]; then
                    echo "FATAL: no cluster-bus certificate material for ${POD_NAME}:" >&2
                    echo "  ${PEER_TLS_DIR}/${f} is missing or empty." >&2
                    echo "  The chart derives the peer-TLS env paths from the Secret, so it must" >&2
                    echo "  carry ca.crt plus ${POD_NAME}.crt AND ${POD_NAME}.key (CN = the node id)." >&2
                    echo "  An operator-supplied Secret with differently-named keys fails HERE," >&2
                    echo "  by name, instead of as a bare broker filesystem error." >&2
                    echo "  Mint or fix the leaves, re-apply the Secret, and retry:" >&2
                    echo "    REPLICAS=${REPLICAS} ./deploy/helm/mqttd/bootstrap.sh" >&2
                    exit 1
                  fi
                done
              fi
              SEED0="\"${STS}-0.${HEADLESS_DOMAIN}:7946\""
              SEED1="\"${STS}-1.${HEADLESS_DOMAIN}:7946\""
              SEED2="\"${STS}-2.${HEADLESS_DOMAIN}:7946\""
              if [ "$ORD" = "0" ]; then
                # Ordinal 0 founds the cluster precisely BECAUSE it renders no seeds. Once a cluster
                # exists, founding again is the split-brain bug: a pod-0 whose volume was lost would
                # mint a SECOND identity beside the live one. CLUSTER_ESTABLISHED disarms the founder
                # so pod-0 seeds to its peers like any joiner and a wiped volume REJOINS instead.
                # A 1-replica cluster has no survivor to split from, so it may still found.
                if [ "${CLUSTER_ESTABLISHED:-}" = "true" ] && [ "$REPLICAS" -gt 1 ]; then
                  if [ "$REPLICAS" = "2" ]; then SEEDS="$SEED1"; else SEEDS="${SEED1}, ${SEED2}"; fi
                  # An armed ordinal 0 is a JOINER in every respect, so it takes the joiner's
                  # readiness floor too. Leaving it at 1 was justified as "with seeds it mints
                  # nothing and bootstraps no lease group, so readiness gates on real admission" —
                  # true only when DURABLE is on. With durable off there is no lease gate at all,
                  # and member_count() counts self, so a floor of 1 let an isolated pod-0 report
                  # Ready and serve clients an empty store. The floor is the only protection there.
                  READY_MIN=$(( REPLICAS / 2 + 1 ))
                else
                  SEEDS=""
                  # Founder, or a single-node cluster: it must be able to come Ready ALONE, or
                  # ordered bring-up never starts and a 1-replica deployment is never healthy.
                  READY_MIN=1
                fi
              else
                if [ "$ORD" = "1" ]; then SEEDS="$SEED0"; else SEEDS="${SEED0}, ${SEED1}"; fi
                READY_MIN=$(( REPLICAS / 2 + 1 ))
              fi
              # Every pod must ADVERTISE a routable peer-bus address, not its 0.0.0.0 bind — peers
              # dial the advertised address over the headless service, and 0.0.0.0 is unroutable
              # (the mesh never links). Per-pod DNS is <pod>.<headless>.<ns>.svc.cluster.local.
              PEER_ADVERTISE="${POD_NAME}.${HEADLESS_DOMAIN}:7001"
              # Same rule for the gossip plane (issue #396): a self-claimed 0.0.0.0 in gossip
              # loops third parties back to their own socket.
              SWIM_ADVERTISE="${POD_NAME}.${HEADLESS_DOMAIN}:7946"
              sed -e "s/__NODE_ID__/${POD_NAME}/g" -e "s|__SEEDS__|${SEEDS}|g" \
                -e "s|__PEER_ADVERTISE__|${PEER_ADVERTISE}|g" \
                -e "s|__SWIM_ADVERTISE__|${SWIM_ADVERTISE}|g" \
                -e "s/__READY_MIN__/${READY_MIN}/g" \
                -e "s/__STORE_MAX_BYTES__/${STORE_MAX_BYTES:-0}/g" \
                "${TMPL_DIR:-/tmpl}/mqttd.toml.tmpl" > "${OUT_DIR:-/config}/mqttd.toml"
              # A short write — e.g. a full ephemeral-storage volume — leaves sed exit 0 with a
              # 0-byte file, and the broker then boots on pure DEFAULTS (no listeners, node id
              # "node-local"): alive as a process, bound to nothing. An empty render is never a
              # valid config, so fail the init container loudly instead of starting a broker
              # that can only fail its probes.
              if [ ! -s "${OUT_DIR:-/config}/mqttd.toml" ]; then
                echo "FATAL: rendered config is empty — is /config out of space?" >&2
                exit 1
              fi
              echo "rendered config for ${POD_NAME} (ordinal ${ORD}):"
              cat "${OUT_DIR:-/config}/mqttd.toml"
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: REPLICAS
              value: {{ .Values.replicaCount | quote }}
            - name: HEADLESS_DOMAIN
              value: {{ printf "%s.%s.svc.cluster.local" (include "mqttd.headlessName" .) .Release.Namespace | quote }}
            {{- if .Values.clusterEstablished }}
            # Day-2 switch: the cluster exists, so ordinal 0 must never found again.
            - name: CLUSTER_ESTABLISHED
              value: "true"
            {{- end }}
            {{- if .Values.storeMaxBytes }}
            # Feeds the config template's __STORE_MAX_BYTES__ placeholder (issue #228).
            # The operator computes this from the observed PVC size instead; the chart
            # takes a declared value.
            - name: STORE_MAX_BYTES
              value: {{ .Values.storeMaxBytes | quote }}
            {{- end }}
            {{- if .Values.secrets.peerTls.secretName }}
            # Arms the per-pod cluster-bus leaf preflight above (issue #262). Set only when
            # a peer-bus Secret is wired, so the check is inert on a plaintext-mesh install.
            - name: PEER_TLS_DIR
              value: {{ .Values.secrets.peerTls.mountPath | quote }}
            {{- end }}
          volumeMounts:
            - name: config-tmpl
              mountPath: /tmpl
            - name: config
              mountPath: /config
            {{- if .Values.secrets.peerTls.secretName }}
            - name: peer-tls
              mountPath: {{ .Values.secrets.peerTls.mountPath }}
              readOnly: true
            {{- end }}
        {{- if .Values.checkConfig.enabled }}
        # 2) Fail the pod BEFORE it serves if the rendered config is invalid (ADR 0046 T3).
        - name: check-config
          image: {{ include "mqttd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["--check-config", "--config", "/config/mqttd.toml"]
          volumeMounts:
            - name: config
              mountPath: /config
        {{- end }}
      containers:
        - name: mqttd
          image: {{ include "mqttd.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          args: ["--config", "/config/mqttd.toml"]
          {{- with (include "mqttd.brokerEnv" . | trim) }}
          env:
            {{- . | nindent 12 }}
          {{- end }}
          ports:
            - name: mqtt-tls
              containerPort: 8883
            - name: health
              containerPort: 8080
            - name: peer
              containerPort: 7001
            - name: gossip
              containerPort: 7946
              protocol: UDP
          # Scale-down is a decommission, not a crash (ADR 0043 / 0047 T4): `mqttd --decommission`
          # sends SIGUSR1 to the broker (PID 1) to drain every held key to its post-departure
          # replica set, then BLOCKS until the broker exits — so k8s holds the pod open for the
          # whole drain before SIGTERM. A hard kill past terminationGracePeriodSeconds falls back
          # to crash semantics the survivors handle.
          lifecycle:
            preStop:
              exec:
                command:
                  - /usr/local/bin/mqttd
                  - --decommission
                  - --timeout
                  - {{ .Values.terminationGracePeriodSeconds | quote }}
          startupProbe:
            {{- toYaml .Values.startupProbe | nindent 12 }}
          readinessProbe:
            {{- toYaml .Values.readinessProbe | nindent 12 }}
          livenessProbe:
            {{- toYaml .Values.livenessProbe | nindent 12 }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /config
            - name: data
              mountPath: /var/lib/mqttd
            {{- if .Values.secrets.tls.secretName }}
            - name: tls
              mountPath: {{ .Values.secrets.tls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.acl.configMapName }}
            - name: acl
              mountPath: {{ .Values.secrets.acl.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.peerTls.secretName }}
            - name: peer-tls
              mountPath: {{ .Values.secrets.peerTls.mountPath }}
              readOnly: true
            {{- end }}
            {{- if .Values.secrets.gossipKey.secretName }}
            - name: gossip-key
              mountPath: {{ .Values.secrets.gossipKey.mountPath }}
              readOnly: true
            {{- end }}
            {{- /* Broker-level extension point (issue #262): the intended use is a
                   cert-manager csi-driver volume for per-pod peer-bus keys, paired with
                   secrets.peerTls.dir. */}}
            {{- with .Values.extraVolumeMounts }}
            {{- toYaml . | nindent 12 }}
            {{- end }}
      volumes:
        - name: config-tmpl
          configMap:
            name: {{ include "mqttd.fullname" . }}-config
        - name: config
          emptyDir: {}
        {{- if .Values.secrets.tls.secretName }}
        - name: tls
          secret:
            secretName: {{ .Values.secrets.tls.secretName }}
        {{- end }}
        {{- if .Values.secrets.acl.configMapName }}
        - name: acl
          configMap:
            name: {{ .Values.secrets.acl.configMapName }}
        {{- end }}
        {{- if .Values.secrets.peerTls.secretName }}
        - name: peer-tls
          secret:
            secretName: {{ .Values.secrets.peerTls.secretName }}
        {{- end }}
        {{- if .Values.secrets.gossipKey.secretName }}
        - name: gossip-key
          secret:
            secretName: {{ .Values.secrets.gossipKey.secretName }}
        {{- end }}
        {{- with .Values.extraVolumes }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.topologySpreadConstraints }}
      topologySpreadConstraints:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
  {{- if .Values.persistence.enabled }}
  {{- with .Values.persistence.retentionPolicy }}
  # PVC lifecycle (Kubernetes >= 1.27; inert on older clusters). Both default to Retain:
  # `whenScaled: Delete` is only safe while a SURVIVOR remains to receive the ADR 0043
  # drain, and Kubernetes applies the policy uniformly — at `--replicas=0` the same
  # setting erases the only copy of every session and retained message (issue #97).
  persistentVolumeClaimRetentionPolicy:
    whenDeleted: {{ .whenDeleted }}
    whenScaled: {{ .whenScaled }}
  {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
        labels:
          {{- include "mqttd.labels" . | nindent 10 }}
      spec:
        accessModes:
          {{- toYaml .Values.persistence.accessModes | nindent 10 }}
        resources:
          requests:
            storage: {{ .Values.persistence.size | quote }}
        {{- if .Values.persistence.storageClassName }}
        storageClassName: {{ .Values.persistence.storageClassName | quote }}
        {{- end }}
  {{- end }}
