apiVersion: v2
name: mqttd-operator
description: >-
  The mqttd Kubernetes operator (ADR 0055): a MqttdCluster CRD and its kube-rs
  reconciler — renders the same objects as the mqttd chart (render-parity gated),
  reports status/conditions from /statusz, and runs the opt-in remediations
  (split-brain fencing, brownout PVC expansion). Alert-only by default; no
  remediation ever deletes data.
type: application
# Chart version — bumped on chart changes. appVersion tracks the operator image
# tag, which is cut by the SAME release pipeline as the broker (one version train).
#
# PINNED RELEASE (issue #252, same discipline as the compose default image, #263):
# the operator image first published at v0.9.1 and rides the broker's release
# train; this appVersion names a published, signed, SBOM'd tag.
# scripts/check-deploy-image-pin.sh gates that it equals the compose pin (one
# tag for the whole repo) and stays an exact X.Y.Z — never a floating name.
version: 0.1.0
appVersion: "1.0.0"
home: https://github.com/mbilling/fss-mqtt-broker
sources:
  - https://github.com/mbilling/fss-mqtt-broker
maintainers:
  - name: project maintainers
kubeVersion: ">=1.24.0-0"
keywords:
  - mqtt
  - operator
  - broker
  - iot
