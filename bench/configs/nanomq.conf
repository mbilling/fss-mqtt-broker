# NanoMQ 0.25.5 — benchmark posture (ADR 0048): the documented reasonable minimum,
# matching the harness contract — plaintext/anonymous on 1883, TLS with REQUIRED
# client certificates on 8883. Option names per the NanoMQ listener reference.
#
# FAIRNESS NOTE (disclosed in results): NanoMQ's shipped config marks the inflight
# window (max_inflight_window / max_awaiting_rel) "unsupported now" — its QoS 1/2
# numbers are not shaped by broker-side flow control the way the other brokers' are.

listeners.tcp {
  bind = "0.0.0.0:1883"
}

listeners.ssl {
  bind = "0.0.0.0:8883"
  keyfile = "/certs/server.key"
  certfile = "/certs/server.pem"
  cacertfile = "/certs/ca.pem"
  verify_peer = true
  fail_if_no_peer_cert = true # mTLS: a client without a certificate is refused
}

auth {
  allow_anonymous = true # like-for-like plaintext posture
  no_match = allow
  deny_action = ignore
}

mqtt {
  # QoS 1/2 publishing stalls at exactly 1024 messages PER CONNECTION (publishers stop
  # receiving PUBACKs — observed in both the 2026-08-03 full and saturate runs, totals
  # always pubs*1024). Raising this did NOT clear it, so the stall is broker behaviour
  # in 0.25.5, not our queue config; kept raised to rule the queue length out. NanoMQ's
  # QoS 1/2 rows are therefore not comparable — disclosed in the results.
  max_mqueue_len = 65535
}
