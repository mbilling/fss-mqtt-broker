# Broker-host kernel tuning for the scale curve. Installed as
# /etc/sysctl.d/99-mqttd-bench.conf by cloud-init. Every value is disclosed in
# the published doc's configuration section — a tuned kernel is part of the rig.
#
# NOT here on purpose: conntrack sizing. No ufw/iptables/docker runs on a broker
# host, so nf_conntrack never loads and every accepted TCP flow costs only the
# socket itself. Hetzner's firewall filters in the hypervisor, not the guest.

# 50k+ sockets need file handles; LimitNOFILE in the unit drop-in matches.
fs.nr_open = 1048576
fs.file-max = 1048576

# A 2 500 conn/s ramp (lane C) fills accept queues faster than the 4096 default
# drains under TLS handshake load.
net.core.somaxconn = 8192
net.ipv4.tcp_max_syn_backlog = 8192
net.core.netdev_max_backlog = 8192

# Moderate per-socket buffers: enough for 256 B MQTT frames at high rate without
# letting 50k sockets book pathological amounts of kernel memory.
net.ipv4.tcp_rmem = 4096 131072 6291456
net.ipv4.tcp_wmem = 4096 131072 6291456
