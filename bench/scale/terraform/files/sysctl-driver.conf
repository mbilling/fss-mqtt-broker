# Driver-host kernel tuning. Installed as /etc/sysctl.d/99-bench-driver.conf by
# cloud-init. A driver opens up to ~25k client connections toward as few as one
# broker address, so the pressure here is ephemeral ports and conntrack, not
# accept queues.

fs.nr_open = 1048576
fs.file-max = 1048576

# ~64k ephemeral ports per (src ip, dst ip, dst port) tuple. At N=1 a driver's
# whole population targets one tuple; the lanes ALSO split each driver's load
# across >=2 emqtt-bench containers to stay clear of the ceiling.
net.ipv4.ip_local_port_range = 1024 65535

# The bench containers' own REST API listeners (9400-9499) sit INSIDE that
# range, so an outbound client connection can take the port a listener is about
# to bind. emqtt-bench then dies with eaddrinuse, that container reports no
# metrics at all, and the settle gate reads the missing clients as ones the
# BROKER refused — a false finding, and one that gets likelier exactly where the
# knee is, because it scales with the connection count (2026-09-16: sub-8 lost
# 9402 at 150k msg/s, twice). Reserved ports are never handed out as ephemeral.
net.ipv4.ip_local_reserved_ports = 9400-9499
net.ipv4.tcp_tw_reuse = 1
net.ipv4.tcp_fin_timeout = 15

# Docker loads nf_conntrack even for --network host containers. Sized, not
# assumed absent: the default table would silently drop new flows mid-ramp,
# which presents as broker connection failures — a false finding.
net.netfilter.nf_conntrack_max = 1048576
