# Systemd drop-in for the benchmark hosts — the shipped deploy/systemd/mqttd.service
# is installed UNTOUCHED and these are the load-test deltas, each with its reason.
# Installed as /etc/systemd/system/mqttd.service.d/override.conf by cloud-init.
[Service]
# The shipped unit caps at MemoryHigh=1.5G/MemoryMax=2G for a modest production
# host. 50k connections on a 16 GB bench host need the ceiling out of the way —
# an OOM-kill mid-run would be a harness artifact, not a finding. The measured
# number is the broker's actual RSS, which the collector records per lane.
MemoryHigh=10G
MemoryMax=12G
# One fd per connection plus stores/listeners; 50k conns must never brush the
# default. fs.nr_open is raised to match in sysctl (99-mqttd-bench.conf).
LimitNOFILE=262144
# Tokio spawns tasks per connection; the shipped default TasksMax could pin a
# fully loaded broker. (Threads, not tasks, count here — this is pure headroom.)
TasksMax=16384

[Unit]
# The bench enables the unit at provision time but the CONFIG arrives later,
# pushed by bootstrap-cluster.sh. On a cloud-init clean+reboot retry the second
# boot auto-starts the enabled unit before any env exists; the resulting
# Restart=on-failure loop exhausts the start limit and poisons the unit, so
# bootstrap's own later restart is refused with "unavailable resources"
# (v1.0.5 curve, size-3 point). No config file, no start attempt.
ConditionPathExists=/etc/mqttd/mqttd.env
