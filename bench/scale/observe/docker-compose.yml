# Local live-observation stack for bench/scale runs (opt-in: OBSERVE=1 ./run.sh …).
#
# Runs on the OPERATOR's machine, not in the cloud: Prometheus receives
# remote-written samples from a Grafana Alloy container on driver-1 (which
# scrapes every broker over the PRIVATE network), arriving through a reverse
# SSH tunnel the rig opens. Grafana serves the demo stack's mqttd dashboards.
#
# Nothing here touches the measurement path: the brokers only ever see
# /metrics GETs from inside the private network, same as the collector's.
services:
  prometheus:
    image: prom/prometheus:latest
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --web.enable-remote-write-receiver
      - --storage.tsdb.retention.time=2d
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

  grafana:
    image: grafana/grafana:latest
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_AUTH_DISABLE_LOGIN_FORM: "true"
    # Published on EVERY interface of the operator's machine (not just loopback)
    # so the dashboards can be watched from another device over Tailscale or the
    # LAN. This is an anonymous-Admin Grafana: whoever can reach this machine's
    # :3000 can edit dashboards and query Prometheus — acceptable on a tailnet or
    # a home LAN, not on a network you do not trust. Prometheus stays on loopback;
    # Grafana reaches it over the compose network.
    ports:
      - "3000:3000"
    volumes:
      - ../../../demo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../../../demo/grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus
