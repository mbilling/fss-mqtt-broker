# Mosquitto 2.0.20 for the cloud single-node comparison (ADR 0048 T4).
#
# Plaintext only: this lane measures the anonymous, in-memory posture every broker
# here is run in, and a TLS listener nobody connects to would still cost the
# process its certificate machinery at startup. The bench/configs/mosquitto.conf
# beside the compose harness keeps both listeners; this one is the cloud subset.
#
# Documented reasonable minimum, not a tuned config: the only deviations from a
# stock install are the ones the benchmark posture requires (anonymous, no
# persistence) and not measuring the logger, which by default writes a line per
# connect and per disconnect — 12 000 connecting clients would otherwise measure
# Mosquitto's log path as much as its delivery path.
allow_anonymous true
persistence false
log_type error
log_type warning
listener 1883
# The default 1024 would refuse this lane's client population outright.
max_connections -1
