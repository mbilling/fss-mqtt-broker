# The module is built for the bare WebAssembly target: no WASI, so it imports nothing.
# The WebAssembly features are spelled out, as for the broker's own jq module: the
# sandbox accepts bulk memory, sign extension, non-trapping conversions, mutable
# globals and multi-value, and nothing newer (ADR 0086 D1).
[build]
target = "wasm32-unknown-unknown"

[target.wasm32-unknown-unknown]
rustflags = [
    "-C", "target-cpu=mvp",
    "-C", "target-feature=+bulk-memory,+sign-ext,+nontrapping-fptoint,+mutable-globals",
]
