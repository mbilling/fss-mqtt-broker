[workspace]
resolver = "2"
members = [
    "crates/mqtt-codec",
    "crates/mqtt-core",
    "crates/mqtt-net",
    "crates/mqtt-auth",
    "crates/mqtt-storage",
    "crates/mqtt-cluster",
    "crates/mqtt-observability",
    "crates/mqtt-config",
    "crates/mqttd",
    "crates/mqtt-bridge",
    "crates/mqttd-operator",
    "crates/history-check",
]
# `tools/mqttui` is a SEPARATE workspace with its own lockfile (ADR 0056 §1). ratatui and
# crossterm must never enter the broker's dependency graph: this workspace is audited by
# cargo-deny and cargo-audit on every push and its lockfile is what the SBOM is cut from.
# A feature flag would not achieve this — it removes a crate from the artifact, not from
# Cargo.lock. The boundary has to be the lockfile.
exclude = ["tools/mqttui"]

[workspace.package]
version = "1.0.12"
edition = "2021"
# Raised from 1.75 by the OTLP/HTTP metric exporter (ADR 0020 T9: the OpenTelemetry
# SDK + reqwest stack requires Rust 1.85), then from 1.85 by jsonwebtoken 11
# (rust-version 1.88; taken for its aws_lc_rs backend — ADR 0053 staged prep).
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/mbilling/fss-mqtt-broker"
authors = ["mqtt-broker contributors"]

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# allow a few pedantic lints that are noisy for early-stage scaffolding
module_name_repetitions = "allow"
missing_errors_doc = "allow"

[workspace.dependencies]
# OIDC JWKS fetching (ADR 0050): already in-tree transitively via opentelemetry-otlp —
# a direct dep adds no new crates. rustls + webpki roots only (no system TLS).
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
# async runtime
tokio = { version = "1", features = ["full"] }
# error handling
thiserror = "2"
# bytes for zero-copy wire buffers
bytes = "1"
# tracing / observability
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# config
serde = { version = "1", features = ["derive"] }
# The workspace's single crypto provider (ADR 0053): backs rustls/quinn TLS, the
# gossip-datagram HMAC (ADR 0003), gossip signatures (ADR 0022), and — via their own
# features — jsonwebtoken and rcgen. Succeeded maintenance-mode ring, which had
# become the SECOND provider after the OTLP/reqwest chain pulled aws-lc-rs in anyway.
aws-lc-rs = "1"
# X.509 parsing for mTLS identity extraction (ADR 0004)
x509-parser = "0.18"
# ACL policy files (ADR 0004 step 3)
toml = "1.1"
# Collects the PATHS of config keys the strict structs do not know (issue #230 /
# ADR 0058 T4): one tolerant pass reports every unknown key at once, and the
# refuse/warn policy is applied to the complete list — replacing the 17 per-struct
# deny_unknown_fields attributes that errored on the FIRST unknown key and made a
# newer config brick an older binary on rollback. dtolnay crate, no transitive deps.
serde_ignored = "0.1"
# Cluster wire + store codec (ADR 0052): succeeded bincode 1.x (RUSTSEC-2025-0141,
# archived upstream). Canonical, deterministic encoding; decode allocations are
# bounded by the input slice, so the frame/datagram caps bound the decoder.
postcard = { version = "1", default-features = false, features = ["use-std"] }
# password hashing (ADR 0004 step 6): Argon2id, no fast hashes
argon2 = "0.5"
# JWT bearer-token verification (ADR 0004 step 6). v11 with the aws_lc_rs backend:
# staged prep for the single-crypto-provider consolidation (ADR 0053) — v9 carried a
# hard dependency on maintenance-mode ring.
jsonwebtoken = { version = "11", features = ["aws_lc_rs"] }
serde_json = "1"
# TLS (ADR 0002, provider per ADR 0053): rustls on aws-lc-rs. TLS 1.3 is the only
# default-reachable version; the tls12 feature is compiled since the 2026-08-11 amendment
# so a deployment with 1.2-only device firmware can OPT IN per listener
# (MQTTD_TLS_ALLOW_TLS12) — unreachable unless that flag is set, never the cluster bus.
rustls = { version = "0.23", default-features = false, features = ["aws-lc-rs", "logging", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["aws-lc-rs", "logging"] }
rustls-pki-types = "1"
# test-only PKI: integration tests mint throwaway CAs instead of skipping verification
rcgen = { version = "0.14", default-features = false, features = ["aws_lc_rs", "pem"] }
# WebSocket transport (ADR 0035): the HTTP Upgrade handshake + WS frame codec only — TLS is
# done by our own rustls (no tungstenite TLS feature), so there is one TLS stack in the broker.
tokio-tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }
# Stream/Sink adapters for the WebSocket byte-stream shim (already in-tree transitively).
futures-util = "0.3"
# QUIC transport (ADR 0036): MQTT-over-QUIC on the same aws-lc-rs provider as the rest
# of the broker (ADR 0053 — one provider; previously quinn-proto linked BOTH ring and
# aws-lc-rs through feature unification).
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log"] }
# Micro-benchmarks (ADR 0044 P6): dev-only, statistical timing of the hot paths.
criterion = "0.8"

# Test/dev builds keep file:line panic locations but drop full debuginfo:
# the workspace's ~30 integration-test binaries at debug=2 exceed 20 GiB of
# target/ churn per rebuild, which exhausts CI/dev disk for no diagnostic
# gain (failures are diagnosed from logs + file:line backtraces).
[profile.dev]
debug = "line-tables-only"

[profile.release]
lto = "thin"
codegen-units = 1
panic = "abort"

# Benchmarks are compiled with release optimisations but KEEP frame pointers and
# debug info, so a sampling profiler can attribute cycles to functions rather
# than to bare addresses. This profile is used by `cargo bench` only — the
# shipped release artifact is unaffected, so the reproducible-build guarantee
# and the binary's size are untouched.
[profile.bench]
# Debug info only — it adds DWARF sections beside identical instructions, so a
# profile is attributable without the numbers moving. `force-frame-pointers`
# was tried here and REMOVED: it changes code generation and cost 25-30% on this
# bench, which is larger than most effects the bench exists to detect and would
# have made every measurement taken under it wrong.
debug = true
