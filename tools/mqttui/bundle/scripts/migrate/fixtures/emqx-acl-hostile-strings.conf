%% FIXTURE PROVENANCE — an ADVERSARIAL fixture, written for this repository.
%%
%% This is NOT the vendor's shipped acl.conf (that is emqx-acl-6.2.2.conf, verbatim).
%% Every rule below was written here on 2026-08-14, in the Erlang-term syntax EMQX 6.2.2
%% reads, to prove ONE property: a value that needs TOML escaping must come out escaped.
%%
%% Before the fix, `{allow, {username, "CORP\\jdoe"}, ...}` produced
%% `identities = ["CORP\jdoe"]`, which tomllib REJECTS ("Unescaped '\' in a string") —
%% and because a TOML parse failure is a WHOLE-DOCUMENT failure, that single AD-style
%% user made the broker refuse to load ANY of the migrated policy. The migration then
%% stalls on an opaque parser error rather than on a TODO. Domain-qualified usernames are
%% what an EMQX ESE / LDAP population actually looks like, so this is the common case.

%% A domain-qualified username: the backslash must survive into `identities`.
{allow, {username, "CORP\\jdoe"}, subscribe, ["devices/${username}/#"]}.

%% A double quote in BOTH the username and the topic filter.
{allow, {username, "svc\"quote"}, publish, ["odd\"topic/#"]}.

%% A plain rule, so the file is not entirely pathological.
{deny, all, subscribe, ["secret/#"]}.
