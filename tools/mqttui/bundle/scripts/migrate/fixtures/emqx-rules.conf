## EMQX rule-engine rules, for the --out-rules translation (ADR 0083).
##
## PROVENANCE. Rules `my_rule_id`, `my_republish_rule`, `client_connected_debug`,
## `receive_msgs_from_remote_mqtt_broker` and the bridge-referencing `my_bridge_rule` are
## COPIED from EMQX's own documentation, emqx/emqx-docs @ release-6.2,
## en_US/develop/data-integration/rule-configs.md ("Use Rules with Configuration Files"),
## which shows exactly this `rule_engine { rules.<id> { sql, actions } }` shape. The SQL
## of `sensors_foreach` is the FOREACH example from rule-sql-syntax.md in the same tree.
## `jq_rule`, `delivered_rule`, `disabled_rule` and the `ignore_sys_message` setting are
## WRITTEN HERE, to exercise the constructs mqttd's engine lacks (jq, a message event)
## and the enable flag; none is attributable to a vendor example.
##
## NO LIVE EMQX BROKER WAS RUN to produce this file.

rule_engine {
    ignore_sys_message = true
    rules.my_rule_id {
        sql = "SELECT * FROM \"t/#\""
        actions = [
            {
                function = console
            },
            {
                function = republish
                args = {
                    topic = "a/1"
                    payload = "${payload}"
                }
            }
        ]
    }
    rules.my_republish_rule {
        sql = "SELECT qos, payload.x as y FROM \"t/a\""
        actions = [
            {
                function = republish
                args = {
                    topic = "t/b"
                    qos = "${qos}"
                    payload = "y: ${y}"
                }
            }
        ]
    }
    rules.my_bridge_rule {
        sql = "SELECT * FROM \"t/#\""
        actions = ["mqtt:my_egress_mqtt_bridge"]
    }
    rules.client_connected_debug {
        sql = "SELECT clientid, connected_at FROM \"$events/client_connected\" WHERE username = 'EMQX'"
        actions = [{function = console}]
    }
    rules.receive_msgs_from_remote_mqtt_broker {
        sql = "SELECT * FROM \"$bridges/mqtt:my_mqtt_source\" WHERE username = 'EMQX'"
        actions = [{function = console}]
    }
    rules.sensors_foreach {
        sql = "FOREACH payload.sensors as s DO clientid, s.name as name, s.idx as idx INCASE s.idx >= 1 FROM \"t/#\""
        description = "one message per sensor"
        actions = [
            {
                function = republish
                args = {
                    topic = "sensors/${idx}"
                    qos = 1
                    retain = false
                    payload = "clientid=${clientid},name=${name}"
                    mqtt_properties { "Content-Type" = "text/plain" }
                }
            }
        ]
    }
    rules.jq_rule {
        sql = "FOREACH jq('.', payload) DO item.field_1 FROM \"t/#\""
        actions = [{function = console}]
    }
    rules.delivered_rule {
        sql = "SELECT from_clientid, topic FROM \"$events/message_delivered\""
        actions = [{function = console}]
    }
    rules.disabled_rule {
        sql = "SELECT clientid FROM \"t/#\""
        enable = false
        actions = [{function = console}]
    }
}
