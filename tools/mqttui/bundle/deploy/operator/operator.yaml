# The operator's own deployment (ADR 0055 T7) — the DEVELOPMENT / e2e manifest.
#
# ⚠️  This manifest cannot start a pod outside kind, deliberately: it pins
# `image: mqttd-operator:e2e` with `imagePullPolicy: Never`, so on any cluster
# that has not had that exact tag side-loaded (`kind load docker-image`) every
# pod stays in ErrImageNeverPull forever. It exists so the nightly e2e installs
# EXACTLY the permissions proven sufficient — no cluster-admin, no secret
# access, no PVC delete.
#
# TO INSTALL THE OPERATOR, use the Helm chart (ADR 0055 T8, issue #252):
# deploy/helm/mqttd-operator — the CRD packaged alongside, the same RBAC as
# here, and the image the release pipeline publishes signed + SBOM-attested
# (ghcr.io/mbilling/fss-mqtt-broker-operator). Keep the RBAC below in lockstep
# with the chart's templates/rbac.yaml.
#
# Minimal and explicit: a ServiceAccount, NAMESPACED RBAC over exactly the
# objects it owns and remediates, and a single-replica Deployment (the Lease
# leader gate makes >1 safe, but one is enough until there is demand).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mqttd-operator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: mqttd-operator
rules:
  # The custom resource it reconciles.
  - apiGroups: ["mqttd.io"]
    resources: ["mqttdclusters", "mqttdclusters/status"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # The objects it renders and owns.
  - apiGroups: ["apps"]
    resources: ["statefulsets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: [""]
    resources: ["services", "configmaps", "serviceaccounts"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  - apiGroups: ["policy"]
    resources: ["poddisruptionbudgets"]
    verbs: ["get", "list", "watch", "create", "patch", "update"]
  # Observation (/statusz targets) + the T4 remediations. `delete` on pods is
  # the split-brain fence; PVCs are patched (quarantine label, expansion) and
  # NEVER deleted — the absence of `delete` here is the guarantee.
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "patch", "update"]
  # Leader election + Events.
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "create", "update", "patch"]
  - apiGroups: ["events.k8s.io", ""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: mqttd-operator
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: mqttd-operator
subjects:
  - kind: ServiceAccount
    name: mqttd-operator
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mqttd-operator
  labels:
    app.kubernetes.io/name: mqttd-operator
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: mqttd-operator
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mqttd-operator
    spec:
      serviceAccountName: mqttd-operator
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
      containers:
        - name: operator
          image: mqttd-operator:e2e
          imagePullPolicy: Never
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: RUST_LOG
              value: info
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
