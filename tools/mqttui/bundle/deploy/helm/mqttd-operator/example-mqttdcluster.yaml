# An example MqttdCluster (ADR 0055) — the operator-managed equivalent of a
# `helm install` of the mqttd chart, with the SAME secure defaults: TLS clients,
# deny-by-default ACL, durable sessions, and a majority readiness floor.
#
# Prerequisites (identical to the chart's): the referenced Secrets/ConfigMap must
# exist in this namespace first. `deploy/helm/mqttd/bootstrap.sh` mints all of
# them (gossip key, server TLS, per-node cluster-bus certificates, a starter ACL)
# — run it once, then `kubectl apply -f` this file. Render parity between the
# operator and the chart is CI-gated, so the two paths produce the same objects.
#
# The config template below is the mqttd chart's default (`values.config`); the
# placeholders (`__NODE_ID__`, `__SEEDS__`, `__PEER_ADVERTISE__`, `__READY_MIN__`)
# are rendered per pod by the same init script the chart uses.
apiVersion: mqttd.io/v1alpha1
kind: MqttdCluster
metadata:
  name: mqttd
spec:
  replicas: 3
  # Defaults to the operator's pinned broker release when omitted.
  # image: ghcr.io/mbilling/fss-mqtt-broker:0.9.1
  secrets:
    tls: mqttd-server-tls
    acl: mqttd-acl
    peerTls: mqttd-peer-tls
    gossipKey: mqttd-gossip-key
  persistence:
    size: 10Gi
  # Every destructive remediation is OPT-IN; the default posture is Alert-only.
  # Uncomment to let the operator fence the minority founder of a detected split
  # brain (it labels the PVC and deletes the pod — it can never delete data; its
  # RBAC has no PVC delete verb):
  # remediation:
  #   splitBrain: Fence
  config: |
    [node]
    id = "__NODE_ID__"
    data_dir = "/var/lib/mqttd"

    [listeners]
    tls_bind = "0.0.0.0:8883"
    health_bind = "0.0.0.0:8080"

    [tls]
    cert = "/etc/mqttd/tls/tls.crt"
    key = "/etc/mqttd/tls/tls.key"

    [security]
    acl_file = "/etc/mqttd/acl/acl.toml"

    [cluster]
    peer_bind = "0.0.0.0:7001"
    peer_advertise = "__PEER_ADVERTISE__"

    [cluster.swim]
    bind = "0.0.0.0:7946"
    seeds = [__SEEDS__]

    [durable]
    enabled = true
    lease_voters = 5

    [runtime]
    config_watch_secs = 30
    ready_min_members = __READY_MIN__
