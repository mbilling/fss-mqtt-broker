# `mqttui` — a terminal UI for running this repository's demo, migration and test scripts
# (ADR 0056). Deliberately its OWN workspace with its OWN lockfile: the broker's graph is
# audited by cargo-deny/cargo-audit on every push and its lockfile is what the SBOM is cut
# from, so nothing here may reach it.
[workspace]

[package]
name = "mqttui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Run the mqttd demo, migration and test scripts from one place"
repository = "https://github.com/mbilling/fss-mqtt-broker"

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# T2: the terminal UI. These are the crates ADR 0056 §1 exists to keep out of the broker's
# dependency graph — they live here, in this workspace's lockfile, and nowhere else.
ratatui = "0.29"
crossterm = "0.28"
# T7: the demo, Kubernetes and compose examples travel INSIDE the binary — measured at
# 161 KB compressed for the whole surface, so this costs nothing worth discussing and buys
# offline operation, version-locking to the binary that was tested with it, and executing
# nothing that arrived over the network.
include_dir = "0.7"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
