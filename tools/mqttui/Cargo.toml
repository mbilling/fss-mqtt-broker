# `mqttui` — a terminal UI for running this repository's demo, migration and test scripts
# (ADR 0056). Deliberately its OWN workspace with its OWN lockfile: the broker's graph is
# audited by cargo-deny/cargo-audit on every push and its lockfile is what the SBOM is cut
# from, so nothing here may reach it.
[workspace]

[package]
name = "mqttui"
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "Apache-2.0"
description = "Terminal UI for the mqttd MQTT broker's demo, migration and operational scripts — examples included, no checkout needed"
repository = "https://github.com/mbilling/fss-mqtt-broker"
readme = "README.md"
homepage = "https://github.com/mbilling/fss-mqtt-broker"
keywords = ["mqtt", "tui", "broker", "migration", "kubernetes"]
categories = ["command-line-utilities"]
# `bundle/` is a GENERATED copy of the repository's demo/, deploy/ and scripts/ directories
# (scripts/vendor-mqttui-examples.sh), and it must ship: `cargo package` includes only files
# beneath the package root, so without it the published crate does not compile. Listed
# explicitly so a future `exclude` cannot drop it by accident.
include = ["src/**/*", "tests/**/*", "bundle/**/*", "tasks.toml", "README.md"]

[dependencies]
serde = { version = "1", features = ["derive"] }
toml = "0.8"
# T2: the terminal UI. These are the crates ADR 0056 §1 exists to keep out of the broker's
# dependency graph — they live here, in this workspace's lockfile, and nowhere else.
ratatui = "0.30"
crossterm = "0.29"
# T7: the demo, Kubernetes and compose examples travel INSIDE the binary — measured at
# 190 KB compressed for the whole surface, so this costs nothing worth discussing and buys
# offline operation, version-locking to the binary that was tested with it, and executing
# nothing that arrived over the network.
include_dir = "0.7"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
