[[task]]
id = "bench-run"
group = "Benchmark"
name = "Run the comparative benchmark"
script = "bench/run.sh"
about = """
Drives the same emqtt-bench workload against mqttd, Mosquitto, EMQX, VerneMQ and NanoMQ,
one broker at a time so they never contend. Versions are pinned and each broker gets its
own documented, reasonable configuration — not ours tuned and theirs default.

Read bench/README.md before publishing anything from it: the harness has honesty rules
about what may be claimed from a single-host run.
"""
requires = ["docker"]
duration = "~15m per broker"
caution = "Pins the host. Nothing else should be running — results are not comparable otherwise."
[[task.env]]
name = "DURATION"
default = "60"
help = "Seconds per scenario"
[[task.env]]
name = "SIZE"
default = "256"
help = "Payload bytes"
[[task.env]]
name = "ONLY"
default = ""
help = "Run one broker only: mqttd|mosquitto|emqx|vernemq|nanomq"

[[task]]
