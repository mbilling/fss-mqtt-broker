# ── Migration ────────────────────────────────────────────────────────────────────────
[[task]]
id = "migrate-mosquitto"
group = "Migration"
name = "Convert a Mosquitto configuration to mqttd"
script = "scripts/migrate/from-mosquitto.py"
about = """
Reads YOUR mosquitto.conf and its acl_file and emits an mqttd TOML config plus an ACL
policy. Anything without an exact equivalent is emitted as a `# TODO(migrate):` comment at
the point it belongs — a converter that silently dropped a setting would be worse than no
converter, because you would deploy believing the policy came across.

Review the output, then validate it: `mqttd --check-config --config <out>`.
"""
requires = ["python3"]
duration = "~1s"
args = ["${INPUT}"]
[[task.env]]
name = "INPUT"
default = "/etc/mosquitto/mosquitto.conf"
help = "The mosquitto.conf to read (passed as the first argument)"

[[task]]
id = "migrate-emqx"
group = "Migration"
name = "Convert an EMQX configuration to mqttd"
script = "scripts/migrate/from-emqx.py"
about = """
Reads YOUR emqx.conf (HOCON) — or the dashboard-managed data/configs/cluster.hocon — plus
its acl.conf, and emits an mqttd TOML config, an ACL policy, and an mqtt-bridge config for
the MQTT bridges it can express. Anything without an exact equivalent is emitted as a
`# TODO(migrate):` comment at the point it belongs, including whole EMQX subsystems mqttd
deliberately does not have (rule engine, data integration, gateways, exhook, plugins, zones,
the dashboard) — a converter that silently dropped a setting would be worse than no
converter, because you would deploy believing the policy came across.

Mappings and fixtures come from emqx/emqx @ 6.2.2's own shipped examples; NO live EMQX was
run. Review the output, then validate it: `mqttd --check-config --config <out>`.
See docs/MIGRATION.md.
"""
requires = ["python3"]
duration = "~1s"
args = ["${INPUT}"]
[[task.env]]
name = "INPUT"
default = "/etc/emqx/emqx.conf"
help = "The emqx.conf (or cluster.hocon) to read (passed as the first argument)"

[[task]]
id = "migrate-hivemq"
group = "Migration"
name = "Convert a HiveMQ configuration to mqttd"
script = "scripts/migrate/from-hivemq.py"
about = """
Reads YOUR HiveMQ config.xml (and, with --credentials, the File RBAC extension's
credentials.xml) and emits an mqttd TOML config plus an ACL policy. Anything without an
exact equivalent is emitted as a `# TODO(migrate):` comment at the point it belongs —
including every unknown XML element, reported by its element path, which is how HiveMQ
ENTERPRISE-only sections (cluster, control-center, the Security and Bridge extensions, the
extension SDK) are handled honestly without this tool ever having seen their schema.

Two things cannot be converted and say so loudly: JKS keystores (a keytool+openssl
extraction recipe is emitted instead) and file-RBAC roles (flattened onto per-user
identities, because mqttd groups come only from OIDC or the HTTP auth hook).

Mappings and fixtures come from HiveMQ CE @ 2026.5 and the file-RBAC extension @ 4.6.16;
NO live HiveMQ was run. Review the output, then validate it:
`mqttd --check-config --config <out>`. See docs/MIGRATION.md.
"""
requires = ["python3"]
duration = "~1s"
args = ["${INPUT}"]
[[task.env]]
name = "INPUT"
default = "/opt/hivemq/conf/config.xml"
help = "The HiveMQ config.xml to read (passed as the first argument)"

[[task]]
id = "migrate-test"
group = "Migration"
name = "Prove the converter's output boots the real broker"
script = "scripts/migrate/test-from-mosquitto.sh"
# Boots the REAL broker from target/debug/mqttd and does not build it — standalone
# there is no toolchain and no source to build from.
needs_checkout = true
about = """
Converts a fixture Mosquitto deployment and then BOOTS mqttd on the result. A migration
tool that emits plausible TOML the broker rejects burns the evaluation it exists to enable,
so this asserts acceptance by the real binary rather than well-formedness (ADR 0051 T6).
"""
