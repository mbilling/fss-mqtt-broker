about = """
Asserts deploy/compose's default image reference is one exact release tag shared by
compose.yaml and bootstrap.sh, that every mqttd flag those artifacts use is on the
checked list, and that the pinned tag's binary parses each flag (or, for a not-yet-
released pin, that it is strictly newer than every released tag and satisfiable by
HEAD). CI runs it on every PR; running it locally needs only git.
"""
requires = ["git"]
duration = "~1s"
hidden = true

[[task]]
id = "audit-verify"
group = "Conformance"
name = "Verify an exported audit stream (chain, genesis, seq, closure)"
script = "scripts/audit-verify.py"
about = """
The SIEM-side half of the audit trail (ADR 0066 T3): given the exported RFC 5424
stream (or bare JSON lines), reproves the SHA-256 hash chain with no secret and no
access to the broker — every head must reproduce from the records themselves, each
chain's genesis must derive from its announced boot id, sequence numbers must be
contiguous, and every chain must close with audit.shutdown. Run with --self-test to
check the verifier against a golden vector generated from the broker's own Rust
implementation; run with a captured stream to audit a deployment. Exit 0 means the
stream is the one the broker wrote and nothing was cut from its tail.
"""
requires = ["python3"]
duration = "~1s"

[[task]]
id = "scale-curve"
group = "Benchmark"
name = "Run the multi-host scaling curve on Hetzner Cloud (PAID)"
script = "bench/scale/run.sh"
about = """
The ADR 0048 §2 curve: fresh 1-, 3- and 5-node clusters on real Hetzner hosts (one
broker, one local NVMe disk per host), the same workload at every size, results for
docs/benchmarks/SCALE-CURVE.md. Start with `smoke` (one node, <€0.50) before `full`
(~€2). Needs HCLOUD_TOKEN from a DEDICATED Hetzner project in the environment and an
SSH keypair — read bench/scale/README.md first. Teardown is trapped on every exit
path; after any run, verify zero servers remain.
"""
requires = ["terraform", "jq", "ssh"]
duration = "~30m smoke, ~4-5h full"
caution = "Creates PAID cloud servers under your HCLOUD_TOKEN. Ctrl-C tears down; kill -9 does not — run teardown.sh after one."

[[task]]
id = "scale-workload"
group = "Benchmark"
name = "Run one named workload pattern's scale curve (PAID)"
script = "bench/scale/workloads/run-workload.sh"
about = """
Five industries, five different traffic shapes, one curve each: market-data
(broadcast fan-out, QoS 0), telematics (100k connections, fan-in, QoS 1 at 1 msg/s),
industrial (durable, latency-critical), smart-home (idle connections), logistics
(store-and-forward — declared but not runnable yet, it needs a lane the rig does not
have). Each workload is a CONFIGURATION of a lane run-curve.sh already has, so a run
is reproducible from its .env file and comparable across releases.

Why it exists: "how many messages per second" is not a property of a broker. The same
cluster on the same hardware measured 188k TPS on one shape and 20k on another, so a
number only means something with the workload named. The file's values are DEFAULTS —
anything exported in the environment wins, which is how a tuning pass toggles one
MQTTD_* setting or sweeps the workload's own axis without editing the file. Read
bench/scale/workloads/README.md for the levers per workload and the two traps
(a QoS 1 number can measure the harness, not the broker; broadcast fan-out cannot
scale linearly with node count).
"""
requires = ["terraform", "jq", "ssh"]
duration = "~40m per workload curve (sizes 1, 3, 5)"
caution = "Creates PAID cloud servers under your HCLOUD_TOKEN. Needs MQTTD_VERSION set — the binary under test is a disclosure item, never a default."

[[task]]
id = "scale-teardown"
group = "Benchmark"
name = "Destroy any leftover scale-curve cloud resources"
script = "bench/scale/teardown.sh"
about = """
The leak sweeper for bench/scale: terraform destroy from local state, then an audit of
everything labeled purpose=mqttd-bench-scale (add --force to delete what the audit
finds; needs the hcloud CLI). Run it after a killed run, a dead laptop, or before
reading the invoice — exit 0 with "nothing leaked" means you are not paying for
anything.
"""
requires = ["terraform"]
duration = "~2m"

[[task]]
id = "scale-summarize"
group = "Benchmark"
name = "Render the scale-curve markdown from a run's raw results"
script = "bench/scale/summarize-curve.py"
about = """
Merges a bench/scale run's raw results (rates summed across drivers, latency
histograms merged bucket-wise and reported as upper bounds, broker counters
cross-checked ±2%, driver-limited rungs excluded from knee detection) into the
markdown tables for docs/benchmarks/SCALE-CURVE.md. Refuses to render the durable
curve for any size missing its per-host barrier probes. Takes the run's results
directory: `summarize-curve.py bench/scale/.runs/<stamp>/results`.
"""
requires = ["python3"]
duration = "~1s"

[[task]]
id = "scale-bootstrap"
group = "Benchmark"
name = "Bootstrap one scale-curve cluster (internal step of scale-curve)"
script = "bench/scale/bootstrap-cluster.sh"
about = """
Mints the per-size secrets locally (cluster PKI via deploy/systemd/gen-certs.sh, one
swim key, a separate client CA), pushes them over SSH, and performs the founder-first
start + arm sequence. run.sh calls this with the run directory and terraform's
inventory JSON; there is nothing to run by hand.
"""
hidden = true
requires = ["jq", "ssh"]

[[task]]
id = "scale-lanes"
group = "Benchmark"
name = "Drive the measurement lanes against one cluster size (internal step of scale-curve)"
script = "bench/scale/run-curve.sh"
about = """
Per-size lane driver: preflight snapshot, per-host barrier probes, durable closed-loop
lane, the $share fan-out ladder, and the idle-connection lane, with CPU sampling and
/metrics snapshots around every rung. Invoked by run.sh with an inventory; not run by
hand.
"""
hidden = true
requires = ["jq", "ssh"]

[[task]]
id = "scale-collect"
group = "Benchmark"
name = "Collect host logs off a scale-curve cluster (internal step of scale-curve)"
script = "bench/scale/collect.sh"
about = """
Pulls broker journals, cloud-init logs and final /metrics off every host right before
a size is destroyed — the only way to diagnose a broker-side stall after the servers
are gone. Invoked by run.sh; not run by hand.
"""
hidden = true
requires = ["jq", "ssh"]

[[task]]
id = "scale-lib"
group = "Benchmark"
name = "Shared helpers for bench/scale (sourced, not executed)"
script = "bench/scale/lib.sh"
about = """
ssh/scp wrappers with a per-run known_hosts file, inventory accessors over terraform's
JSON output, bounded wait loops, and the OpenSSL picker (macOS LibreSSL cannot mint
the PKI). Sourced by every bench/scale script; running it directly does nothing.
"""
hidden = true

[[task]]
id = "scale-observe"
group = "Benchmark"
name = "Live Grafana for a scale-curve run (laptop + reverse tunnel)"
script = "bench/scale/observe.sh"
about = """
Opt-in live observation of a bench/scale run (OBSERVE=1, or attach by hand): a
local docker compose runs Grafana (:3000, the demo mqttd dashboards) and
Prometheus (:9090, remote-write receiver); a Grafana Alloy container on
driver-1 scrapes every broker over the PRIVATE network at 2s and remote-writes
through a reverse SSH tunnel the rig opens. Zero agents and zero load on the
measured broker hosts — the brokers only ever see /metrics GETs from inside
the private net, same as the collector's.
"""
requires = ["docker", "ssh"]
duration = "runs alongside a bench/scale run"
