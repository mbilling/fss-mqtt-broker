duration = "~1s"
hidden = true

[[task]]
id = "check-readme-facts"
group = "Internal"
name = "Check the README's derivable facts"
script = "scripts/check-readme-facts.py"
# Checks the repo's README against the repo.
needs_checkout = true
about = "Validates the ADR count, crate table and anchors against the repository."
requires = ["python3"]
duration = "~1s"
hidden = true

[[task]]
id = "vendor-examples"
group = "Internal"
name = "Refresh the vendored example bundle inside the mqttui package"
script = "scripts/vendor-mqttui-examples.sh"
# Copies FROM this repository's demo/, deploy/ and scripts/ — there is nothing to copy
# without them.
needs_checkout = true
hidden = true
about = """
tools/mqttui/bundle/ is a generated copy of demo/, deploy/, scripts/migrate/ and
scripts/k8s/. It exists because `cargo package` includes only files beneath the package
root, so include_dir! pointing at ../../ builds from a checkout and produces a crate that
cannot compile once published. CI runs `--check`, so the copy cannot go stale unnoticed.
"""
requires = ["diff"]
duration = "~1s"

[[task]]
