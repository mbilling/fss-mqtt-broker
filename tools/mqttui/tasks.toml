duration = "~10s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker to test against; this script does NOT build one, it exits 2"

[[task]]
id = "migrate-test-emqx"
group = "Migration"
name = "Prove the EMQX converter's output is accepted by the real binaries"
script = "scripts/migrate/test-from-emqx.sh"
# Boots the REAL broker and the REAL bridge from target/debug and does not build them —
# standalone there is no toolchain and no source to build from.
needs_checkout = true
about = """
Converts vendor-derived EMQX fixtures and then asks the real binaries to accept the
results: `mqttd --check-config` on the config (ADR 0051 §3's third rule), a broker BOOT on
the translated ACL, and mqtt-bridge's own parse+validate on the bridge config. It also
asserts the other half of the contract on an adversarial fixture — unknown keys, whole
subsystems with no equivalent, malformed input, an empty file, and the vendor's own default
acl.conf whose four rules each land on a different gap — proving each becomes a
TODO(migrate) line rather than a drop or a crash (ADR 0051 T7).
"""
requires = ["python3", "curl"]
duration = "~15s"
[[task.env]]
name = "MQTTD_BIN"
