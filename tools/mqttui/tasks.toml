help = "Prebuilt broker to test against; this script does NOT build one, it exits 2"
[[task.env]]
name = "MQTT_BRIDGE_BIN"
default = ""
help = "Prebuilt mqtt-bridge; this script does NOT build one, it exits 2"

[[task]]
id = "migrate-test-hivemq"
group = "Migration"
name = "Prove the HiveMQ converter's output is accepted by the real broker"
script = "scripts/migrate/test-from-hivemq.sh"
# Boots the REAL broker from target/debug/mqttd and does not build it.
needs_checkout = true
about = """
Converts vendor-derived HiveMQ fixtures and then asks the real broker to accept the
results: `mqttd --check-config` on the config and a BOOT on the translated ACL. It also
proves the contract's other half — unknown XML elements reported by path, every HiveMQ
Enterprise construct reported rather than dropped, an empty document and malformed XML
handled without a crash, keystore passwords and PBKDF2 hashes never copied into the
output, and cert-OPTIONAL client auth never turned into an mTLS mandate (ADR 0051 T17).
"""
requires = ["python3", "curl"]
duration = "~10s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker to test against; this script does NOT build one, it exits 2"

[[task]]
id = "migrate-property-sweep"
group = "Migration"
name = "Sweep a converter's defect CLASSES over permuted inputs"
script = "scripts/migrate/property_sweep.py"
# Run by all three test-from-*.sh steps; declared so the manifest knows about it. Hidden
# because the useful entry points are those three, not this one.
hidden = true
needs_checkout = true
about = """
The three fixture tests are example-based: one input, a list of greps — so they catch a
regression exactly where a reviewer already looked and are blind everywhere else. That is
how the same first-listener-only TLS defect was found three times in three converters,
each harness having only ever fed its converter ONE ordering of ONE listener set.

This generates many inputs from a cross product (listener ORDER, enable flags, mTLS
postures, `no_match` postures, truststore presence, the Mosquitto default-listener form,
`protocol websockets`, a listener-scoped EMQX authn chain, `acl_claim_name`, a TLS bridge)
and asserts SEVEN invariants per defect CLASS on every one: (A) nothing silently dropped —
every security-relevant input value appears in the output, translated or named in a
TODO/NOTE; (B) nothing disabled activated; (C) no deny/allow claim contradicting the
`default` the same document writes; (D) no dangling `step N` cross-reference; (E) `mqttd
--check-config` on every generated config; (F) PROVENANCE — every LIVE security-relevant
value is one the INPUT held (for a `*_bind`, the PORT always), which is the invariant (A)
could not express: (A) asks only whether a value appears somewhere, so it passed while a
bind was FABRICATED; and (G) NO LIVE SETTING WITHOUT A SOURCE — every uncommented
security-relevant line carries `# from: <input key>`, which is what proves the converters'
emission gate was not bypassed at a site nobody has looked at yet.

`--fuzz N` runs a different pass: each fixture mutated mechanically (lines deleted, the
file truncated mid-structure, blocks permuted, enable flags flipped, transports swapped),
asserting only that the converter always exits 0 or 1 WITH A MESSAGE, never hangs, writes
valid TOML, and never invents a live security-relevant setting. That is how from-emqx.py's
HOCON reader was caught spinning forever at 100% CPU on a two-line input.

Usage: `python3 scripts/migrate/property_sweep.py mosquitto|emqx|hivemq --mqttd <bin>`,
or `... mosquitto --fuzz 200 [--seed N]`.
"""
requires = ["python3"]
duration = "~15s per converter; --fuzz 200 is ~10s more"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Passed through by the test-from-*.sh callers as --mqttd; optional standalone"

[[task]]
id = "dual-run-smoke"
group = "Migration"
name = "Run the dual-run cutover playbook's bridge step for real"
script = "scripts/migrate/dual-run-smoke.sh"
# Boots the REAL broker, the REAL bridge and a REAL third-party broker; builds none of them.
needs_checkout = true
about = """
docs/MIGRATION.md tells you to bridge your incumbent broker to mqttd, move clients in
cohorts, verify, then cut. This runs that document's own bridge config against real
binaries — mqttd, mqtt-bridge, and Mosquitto standing in for the incumbent — and asserts
its SIX claims: the inbound leg crosses at QoS 1, the outbound leg crosses (a moved client
can still reach an unmoved one), RETAINED state crosses by itself, one inbound publish yields
exactly one delivery (with mqttd's own No Local shown to have made the cut, by its counters),
one OUTBOUND publish yields exactly one delivery on the incumbent (which is the assertion that
puts the FOREIGN broker's No Local on the hook), and a retained value pruned with the bridge UP
stays gone on BOTH sides — the mitigation for the resurrection hazard the bidirectional
connect-time re-sync creates.

Needs the mosquitto BROKER, not just its clients; exits 2 (not 1) if anything is missing,
so "environment not ready" is never mistaken for "assertion failed" (ADR 0051 T18).
"""
requires = ["mosquitto", "mosquitto_pub", "mosquitto_sub", "python3", "curl"]
duration = "~20s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker; this script does NOT build one, it exits 2"
[[task.env]]
name = "MQTT_BRIDGE_BIN"
default = ""
help = "Prebuilt mqtt-bridge; this script does NOT build one, it exits 2"

[[task]]
id = "differential-mosquitto"
group = "Migration"
name = "Differential-test the Mosquitto converter against the real vendor broker"
script = "scripts/migrate/differential-mosquitto.sh"
# Boots the REAL mosquitto broker and the REAL mqttd binary; builds neither.
needs_checkout = true
about = """
The semantic oracle (issue #297). The provenance gate proves a converted value came from a
named input key; it cannot prove the key MEANS what the converter took it to mean, and five
review rounds showed that class does not converge under inspection. So this measures instead
of reading: the SOURCE mosquitto.conf boots the real vendor broker, the CONVERTED config
boots mqttd (finished exactly as its own TODOs instruct — re-hashed credentials, the ACL
path, a data dir), and the same client binaries probe both. Seven verdicts are diffed —
anonymous access, a wrong password, a valid credential, a permitted and a forbidden publish,
a permitted and a forbidden subscription — at the ACCEPTED/REFUSED and
DELIVERED/NOT_DELIVERED level, because reason codes legitimately differ while whether a
client gets in and a message crosses is exactly the meaning the mappings claim to preserve.
A divergence is a semantic misread: the converter carried the words and lost the meaning.

Needs the mosquitto BROKER, not just its clients; exits 2 (not 1) if anything is missing,
so "environment not ready" is never mistaken for "assertion failed".
"""
requires = ["mosquitto", "mosquitto_passwd", "mosquitto_pub", "mosquitto_sub", "python3", "curl"]
duration = "~15s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker; this script does NOT build one, it exits 2"

# ── Try it ───────────────────────────────────────────────────────────────────────────
[[task]]
id = "cert-audit"
group = "Migration"
name = "Audit a fleet of client certificates for what mqttd requires"
script = "scripts/migrate/cert-audit.sh"
about = """
Reads a directory of device certificates and flags every one that would be REJECTED by
mqttd — most importantly a MISSING clientAuth EKU, which rustls refuses at the handshake
even for an otherwise-valid cert issued by a trusted CA. OpenSSL-based brokers tolerated
EKU-less device certs for years, so a migrating fleet discovers this by outage unless it
is checked first. Also flags weak keys (RSA < 2048, EC < 256), MD5/SHA-1 signatures, and
expired certs. Exit 1 if any cert is a blocker, so it gates a pre-migration check.
"""
requires = ["openssl"]
duration = "~1s"
args = ["${CERT_DIR}"]
[[task.env]]
name = "CERT_DIR"
default = "/etc/mqttd/device-certs"
help = "Directory of device certificates to audit (or pass files)"

[[task]]
id = "quickstart"
group = "Try it"
name = "Run the README's own two-node cluster"
script = "scripts/quickstart-smoke.sh"
about = """
Executes the README's quickstart verbatim — two nodes discovering each other over SWIM
gossip with no static peer list, then a publish on one delivered to a subscriber on the
other, then the secured variant with TLS, mTLS and an ACL.

It exists so the documented getting-started path cannot silently rot: if the README stops
working, this fails.
"""
requires = ["mosquitto_pub", "mosquitto_sub", "python3", "curl", "openssl"]
duration = "~30s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker; empty builds one first"

[[task]]
id = "integration-consumer"
group = "Try it"
name = "Run the external-consumer integration blueprint's claims"
script = "scripts/integration-consumer-smoke.sh"
about = """
Executes docs/INTEGRATION.md — the rule-engine replacement story (ADR 0063) — against
the real broker with stock mosquitto clients: a `$share` consumer group (one MQTT 5
member, one 3.1.1) splits a QoS 1 stream with single delivery; a retained value skips
the group but reaches the documented plain-subscribe bootstrap; and with every member
disconnected, QoS 1 publishes queue in the durable session and replay in order on
reconnect.

It exists so the integration blueprint cannot silently rot: if the documented pattern
stops working, this fails.
"""
requires = ["mosquitto_pub", "mosquitto_sub", "python3", "curl"]
duration = "~30s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker; empty builds one first"

[[task]]
id = "deploy-smoke"
group = "Try it"
name = "Boot the three-node compose/systemd reference deployment"
script = "scripts/deploy-smoke.sh"
about = """
Brings up three real nodes using the values from the SHIPPED deploy/systemd/mqttd.env.example
— it parses that file rather than restating it, so a setting renamed in the artifact fails
here rather than on somebody's first install.

Every client connection is over TLS and the cluster bus is mutually authenticated, because
that is what the shipped artifacts configure. BOTH shipped PKI recipes are called rather than
restated: deploy/compose/init.sh mints the three-node cluster's material, and
deploy/systemd/gen-certs.sh mints one cluster CA plus per-node leaves that TWO MORE nodes are
booted from and made to route to each other. So the four peer-certificate rules that are easy
to get wrong — CN equals the node id, the SAN covers the MQTTD_PEER_ADVERTISE host, both
serverAuth and clientAuth, an ECDSA key rather than RSA — are exercised rather than merely
documented, as is the one-CA-per-cluster contract (a per-host CA forms no mesh at all).

Proves anonymous clients are refused, a cleartext client is refused, a generated password
authenticates, the ACL confines a device to its own subtree, a publish on node 1 reaches a
subscriber on node 3, an acknowledged QoS 1 message survives SIGKILL of the node that
accepted it, a minority node reports live-but-not-ready, no node logs INSECURE, every node
signs its gossip per-node (ADR 0022), and plaintext exists only behind the explicit
compose.plaintext.yaml overlay.
"""
requires = ["mosquitto_pub", "mosquitto_sub", "python3", "openssl"]
optional = ["docker", "systemd-analyze"]
duration = "~90s"
[[task.env]]
name = "MQTTD_BIN"
default = ""
help = "Prebuilt broker; empty builds one first"

[[task]]
id = "image-smoke"
group = "Try it"
name = "Exercise the container image as a user runs it"
script = "scripts/image-smoke.sh"
about = """
Runs the published image and checks the properties a hardened image claims: it runs as a
non-root user, its data directory is writable by that user, durable state survives a
restart, and it still works under `--read-only --cap-drop ALL`. Also runs the README's
secured container invocation (mounted certs + ACL): an mTLS round-trip inside the grant,
a no-certificate client refused at the handshake, and no INSECURE log line.
"""
requires = ["docker", "mosquitto_pub", "mosquitto_sub", "openssl"]
duration = "~60s"
[[task.env]]
name = "IMAGE"
default = "ghcr.io/mbilling/fss-mqtt-broker:latest"
help = "Image to exercise"

[[task]]
id = "compose-smoke"
group = "Try it"
name = "Bring the shipped compose reference deployment up in containers"
script = "scripts/compose-smoke.sh"
about = """
Runs the reader's own two commands — `./bootstrap.sh` then `docker compose up -d` — on the
shipped deploy/compose/compose.yaml, in real containers. deploy-smoke.sh proves the broker's
behaviour with the shipped VALUES but only ever `docker compose config`s the file; this
covers everything that lives between the YAML and a running container.

Proves: with secrets/ absent the bring-up fails, creates no broker, and names ./bootstrap.sh;
after bootstrap all three brokers reach HEALTHY (which on a native-Linux host is the proof
that uid 65532 can read the staged secrets under a read-only rootfs); a TLS publish on node 3
reaches a TLS subscriber on node 1; a client with no --cafile, one verifying against the
wrong CA, and one with a wrong password are all refused; nothing is published on host port
1883; no container logs INSECURE and all three sign their gossip per-node; the documented
"arm the founder" step works and an armed founder alone goes live-but-not-ready and recovers
with the majority (docs/SECURED-CLUSTER-TUTORIAL.md runs on these checks); and the explicit
`-f compose.yaml -f compose.plaintext.yaml` overlay restores plaintext on loopback while
logging INSECURE for it.

WHAT IT DOES NOT COVER: the lane always supplies its own image, so compose.yaml's published
`:latest` default is never exercised. That default is currently broken — `--probe` and
`--hash-password` postdate v0.9.0, which `:latest` is — and is tracked as issue #263. Read
"all three brokers reach HEALTHY" as true of the image under test, not of the shipped default.

Needs host ports 8883-8885 (and 1883-1885 during the overlay phase) to be free.
"""
requires = ["docker", "mosquitto_pub", "mosquitto_sub", "openssl"]
duration = "~3m"
[[task.env]]
name = "MQTTD_IMAGE"
default = ""
help = "Prebuilt image; empty builds one from the working tree"

