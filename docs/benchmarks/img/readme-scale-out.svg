<title id="t">Cluster throughput from 1 to 10 nodes, no message lost on any column</title><desc id="d">Columns are the cluster's msg/s at 1, 3, 10 nodes; the per-node rate is printed under each total. The green part is the highest step carried at p99 ≤ 1 s; a yellow cap reaches the maximum lossless step when it ran at p99 ≤ 5 s, a red cap when it ran above. Durable QoS 1, 1 nodes: 92.9k msg/s per node lossless, 92,900 msg/s in total (maximum lossless; ack p99 744 ms; 1 copy, fsync only); Durable QoS 1, 3 nodes: 39.3k msg/s per node lossless, 117,800 msg/s in total (maximum lossless; ack p99 1.35 s); 114,200 msg/s at p99 ≤ 1 s (ack p99 708 ms); Durable QoS 1, 10 nodes: 29.2k msg/s per node lossless, 292,200 msg/s in total (maximum lossless; ack p99 1.37 s); 228,000 msg/s at p99 ≤ 1 s (ack p99 59 ms); QoS 1, clean sessions, 1 nodes: 114k msg/s per node lossless, 114,000 msg/s in total (maximum lossless; ack p99 315 ms); QoS 1, clean sessions, 3 nodes: 90.3k msg/s per node lossless, 270,800 msg/s in total (maximum lossless; ack p99 3.31 s); 152,000 msg/s at p99 ≤ 1 s (ack p99 67 ms); QoS 1, clean sessions, 10 nodes: 87.6k msg/s per node lossless, 875,900 msg/s in total (maximum lossless; ack p99 4.54 s); 303,800 msg/s at p99 ≤ 1 s (ack p99 85 ms); QoS 0, 1 nodes: 123k msg/s per node lossless, 123,100 msg/s in total (maximum lossless; end-to-end p99 136 ms); QoS 0, 3 nodes: 113k msg/s per node lossless, 340,300 msg/s in total (maximum lossless; end-to-end p99 2.52 s); 253,200 msg/s at p99 ≤ 1 s (end-to-end p99 547 ms); QoS 0, 10 nodes: 97.3k msg/s per node lossless, 973,200 msg/s in total (maximum lossless; end-to-end p99 4.49 s); 506,300 msg/s at p99 ≤ 1 s (end-to-end p99 395 ms).</desc>
