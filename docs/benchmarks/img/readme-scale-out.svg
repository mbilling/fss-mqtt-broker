<title id="t">Per-node throughput holds from 3 to 10 nodes, durable QoS 1 included</title><desc id="d">Columns are msg/s per node at 3 and 10 nodes; the cluster total is printed above each column. A filled green column was certified GREEN by the rig (p99 ≤ 1 s, zero loss); a green outline holds by the reading rule (zero loss, p99 ≤ 1 s) and was not certified; a yellow cap was carried with zero loss at p99 ≤ 5 s; an arrow marks the top of the ladder that was run. Durable QoS 1, default store (redb), 3 nodes: 19.3k msg/s per node, 57,973 msg/s in total, holds, not certified; Durable QoS 1, default store (redb), 10 nodes: 18.5k msg/s per node, 185,376 msg/s in total, holds, not certified; Durable QoS 1, log store (experimental in 1.2.0), 3 nodes: 30.0k msg/s per node, 90,003 msg/s in total, certified GREEN; Durable QoS 1, log store (experimental in 1.2.0), 10 nodes: 27.0k msg/s per node, 270,034 msg/s in total, certified GREEN; QoS 1, clean sessions, 3 nodes: 50.0k msg/s per node, 150,002 msg/s in total, certified GREEN, the top of the ladder run; QoS 1, clean sessions, 10 nodes: 45.0k msg/s per node, 449,995 msg/s in total, holds, not certified, the top of the ladder run; QoS 0, 3 nodes: 120k msg/s per node, 360,000 msg/s in total, certified GREEN, the top of the ladder run; QoS 0, 10 nodes: 114k msg/s per node, 1,140,000 msg/s in total, holds, not certified; YELLOW at 1,200,000 msg/s (p99 ≤ 5 s, zero loss). Durable QoS 1 and QoS 1 clean sessions on the 1.2.0 release candidate ec407218, 2026-10-21; QoS 0 on main 0a08187, 2026-09-26.</desc>
