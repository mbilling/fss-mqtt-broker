<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" role="img" aria-labelledby="t d">
<title id="t">Latency follows the load per node, not the cluster size: ack p99 from 3 to 12 nodes</title><desc id="d">Ack p99 on a log scale against msg/s offered per node for every step of the five plant-shape ladders, coloured by node type, one line per ladder through its carried steps. The 3-, 5- and 8-node m6i.4xlarge ladders and the 12-node c6in.4xlarge ladder lie on one curve: about 1 ms to 75k a node, 12-16 ms at 110k, 46-55 ms at 132-141k, 180 ms at 155k, 390-570 ms at 165k and 657 ms at 167k, the 12-node ladder's end. The 12-node m6i.4xlarge ladder leaves that curve early: 39 ms at 110k a node, a voided round at 463 ms at 121k, the offer not taken at 132k, its network card throttled. Steps not carried are hollow marks. Source: the runs h3-20261106T145432Z (3 × m6i.4xlarge), h3-20261106T170406Z (5 × m6i.4xlarge), h3-20261106T182931Z (8 × m6i.4xlarge), h3-20261106T194402Z (12 × m6i.4xlarge), h3-20261106T233606Z (12 × c6in.4xlarge).</desc>
