<title id="t">Add a node, add 165k msg/s: durable QoS 1 scales linearly to 3 million msg/s on 18 nodes</title><desc id="d">Columns of the cluster's maximum lossless msg/s at 3, 5, 8, 12 and 18 nodes on AWS, coloured by node type, the type named under each column. 3 × m6i.4xlarge: 496k msg/s, 165k a node, ack p99 486 ms; 5 × m6i.4xlarge: 826k msg/s, 165k a node, ack p99 389 ms; 8 × m6i.4xlarge: 1.32M msg/s, 165k a node, ack p99 494 ms; 12 × c6in.4xlarge: ≥ 2.0M msg/s, 167k a node, ack p99 657 ms; 12 × m6i.4xlarge: ≥ 1.32M msg/s, 110k a node, ack p99 39 ms; 18 × c6in.4xlarge: 2.99M msg/s, 166k a node, ack p99 711 ms. A dotted line extends the 3-node rate, 165k a node. At 12 nodes the m6i.4xlarge column stops at 1.32M with a dashed extension to the 1.57M the brokers received but did not carry, its network card throttled; the c6in.4xlarge column, the same CPU with a network-optimized card, reaches 2.0M, the rig's ceiling then. At 18 nodes, c6in.4xlarge, the column reaches 2.99M with its knee bracketed above. Source: bench/scale/rig2 runs h3-20261106T145432Z (3 × m6i.4xlarge), h3-20261106T170406Z (5 × m6i.4xlarge), h3-20261106T182931Z (8 × m6i.4xlarge), h3-20261106T233606Z (12 × c6in.4xlarge), h3-20261106T194402Z (12 × m6i.4xlarge), h3-20261126T112146Z (18 × c6in.4xlarge), each run's report.md.</desc>
