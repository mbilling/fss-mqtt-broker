<title id="t">QoS 1 per node on the 1.2.0 candidate: every rung held, nothing lost</title><desc id="d">One column per rung, msg/s per node, as the brokers' own counters delivered it. A filled green column is a rung the rig certified GREEN (p99 ≤ 1 s, zero loss); a green outline holds by the reading rule (no message lost, p99 ≤ 1 s) and is NOT certified by the rig; a dashed grey column does not hold; a tick above a column is the offered rate where the brokers delivered less. QoS 1, clean sessions — the routing path, 3 nodes (0.00% forwarded): 4 sites 40.0k of 40.0k offered, certified GREEN, 4 sites 40.0k of 40.0k offered, certified GREEN, 5 sites 50.0k of 50.0k offered, certified GREEN; QoS 1, clean sessions — the routing path, 10 nodes (0.00% forwarded): 13 sites 39.0k of 39.0k offered, holds, not certified, 14 sites 42.0k of 42.0k offered, holds, not certified, 13 sites control 39.0k of 39.0k offered, holds, not certified; Durable QoS 1 — default store, 2 copies, fsync + quorum ack, 3 nodes (0.00% forwarded): 12 sites 20.7k of 24.0k offered, holds, not certified, 15 sites 20.9k of 30.0k offered, holds, not certified; Durable QoS 1 — default store, 2 copies, fsync + quorum ack, 10 nodes (13–17% of publishes forwarded): 25 sites 15.0k of 15.0k offered, holds, not certified, 35 sites 19.2k of 21.0k offered, holds, not certified, 40 sites 21.1k of 24.0k offered, holds, not certified, 25 sites control 15.0k of 15.0k offered, certified GREEN</desc>
