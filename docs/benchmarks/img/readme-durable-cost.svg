<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560" role="img" aria-labelledby="t d">
<title id="t">Durable QoS 1 costs 2.0–3.4× less to run than HiveMQ, before its licence</title><desc id="d">Monthly infrastructure cost against durable QoS 1 throughput, both priced at AWS m6a.8xlarge on-demand ($0.0432 per vCPU-hour, 730 hours a month), no licence. mqttd, 3 nodes: 114,200 msg/s on 12 vCPU, $378 a month; HiveMQ 4.18 at the same rate $1,281 (3.4×); mqttd, 10 nodes: 228,000 msg/s on 40 vCPU, $1,261 a month; HiveMQ 4.18 at the same rate $2,557 (2.0×); HiveMQ 4.18 published: 270,000 msg/s on 96 vCPU, $3,027 a month, drawn as a straight line from that one point. mqttd's line is extended dotted: below its first point at that point's msg/s per vCPU, above its last along the slope between its last two; at HiveMQ's published rate it needs about 13 nodes, $1,640 a month. HiveMQ's clustering needs its commercial edition, whose price is not published and is not included.</desc>
