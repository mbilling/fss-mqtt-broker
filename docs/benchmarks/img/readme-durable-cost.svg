<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 466" width="1000" height="466" role="img" aria-labelledby="t d">
<title id="t">Durable QoS 1: the hardware behind a million msg/s costs 1.45–3.5× less than HiveMQ's</title><desc id="d">Two horizontal bars of what the hardware behind a million msg/s of durable QoS 1 costs a month, both brokers priced at AWS m6a.8xlarge on-demand ($0.0432 per vCPU-hour, 730 hours a month), no licence. mqttd, measured, as a range across node sizes: 3 × 4 vCPU $3,212 · 10 × 4 vCPU $4,317 · 6 × 16 vCPU $7,757 (the maximum lossless step of each run), 1.45–3.5× less than HiveMQ; on HiveMQ's own shape, 3 × 32 vCPU, $9,881, 1.13× less. HiveMQ 4.18, published: $11,213 (270,000 msg/s on 3 × 32 vCPU, $3,027 a month · published 2023, default configuration (persistent, 2 copies), payload not published). At HiveMQ's spend, $3,027 a month (96 vCPU): mqttd 390,300 msg/s (six 16-vCPU nodes), HiveMQ 270,000 msg/s (3 × 32 vCPU), mqttd 45% more. For HiveMQ's traffic, 270,000 msg/s: mqttd $1,261 a month (ten 4-vCPU nodes, carrying 292,200), HiveMQ $3,027 a month (3 × 32 vCPU), mqttd 2.4× less.</desc>
