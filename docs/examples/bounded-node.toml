# A BOUNDED node — every resource limit set (docs/SIZING.md's worked example).
#
# Target hardware: 4 GiB RAM / 20 GiB disk. The arithmetic behind each number is in
# docs/SIZING.md; the full commented reference for every key is docs/mqttd.example.toml.
# Validate:  mqttd --check-config --config bounded-node.toml
#
# The shipped defaults are safe against attackers but UNCAPPED against success:
# without this file's [limits] block, connections, sessions, retained topics, and
# disk all grow without bound. On a machine with a budget, set them.

[node]
id = "node-1"
# Without data_dir, ALL state is in memory and the disk section below is moot.
data_dir = "/var/lib/mqttd"

[listeners]
# TLS-only posture; see mqttd.example.toml for the other listeners and cert keys.
tls_bind = "0.0.0.0:8883"

[tls]
cert = "/etc/mqttd/tls/server.pem"
key = "/etc/mqttd/tls/server.key"
client_ca = "/etc/mqttd/tls/ca.pem"

[security.auth_penalty]
# Unset = unlimited auth attempts. On any internet-reachable listener, set it.
threshold = 10
decay_secs = 60

[durable]
# Disk high-water mark, ONE aggregate bound over all four stores. Above it: brownout —
# growth writes refused — a new session (counted in
# quota_rejections_total{reason="brownout"}), a new retained topic (counted in
# quota_rejections_total{reason="retained"}, the retained quota's label) and an offline
# enqueue, for which a QoS>=1 publisher is REFUSED rather than acked (v5 0x97 / v3.1.1 no
# ack + close; cross-node via a peer-bus verdict — mid-rolling-upgrade an older link
# withholds the ack and closes instead; counted in
# quota_rejections_total{reason="brownout-publish"}). Subscriber acks/reads/expiry
# continue, recovery below the mark restores writes. It is a high-water
# mark, not a hard wall: leave headroom (here 4 GB of the 20 GB disk). The mark is
# AGGREGATE, so one store can eat the whole budget — the broker WARNs once, naming the
# store, above 70% of it, and `store_bytes{store}` is always exported.
store_max_bytes = 16000000000

[limits]
# RAM driver #1: connections × max_packet_size bounds worst-case read buffering.
# 2000 × 256 KiB ≈ 0.5 GiB.
max_connections = 2000
max_connections_per_ip = 500
max_packet_size = 262144

# RAM/disk driver #2 — THE dominant term: sessions × queued × message size.
# The default (100 000/session) is sized for one important session, not thousands.
# 5000 sessions × 500 msgs × 4 KiB avg ≈ 9.8 GiB durable worst case, inside the
# store mark above. NOTE this is a COUNT cap on DISK: it bounds bytes only together
# with max_packet_size (a byte cap for the OFFLINE queue is still ADR 0041 T6).
max_sessions = 5000
max_queued_messages = 500
# Both overflow policies ack-and-drop at the cap — senders are NEVER told (the
# ack already happened, or is owed regardless). The choice is only WHICH message
# is shed: the queue's oldest (default) or the arriving one.
queue_overflow = "drop-oldest"   # or "reject-newest"

# Retained: 50 000 × 4 KiB avg ≈ 0.2 GiB. New topics beyond the cap are refused
# (0x97); overwriting or clearing an existing topic is always allowed.
max_retained_messages = 50000

# RAM driver #3 — what ONE stalled subscriber holds in memory (issue #241). Unset,
# these three structures allow (65 535 + 10 000 + 10 000) × max_packet_size ≈ 21 GiB
# per stalled subscriber at the 256 KiB packet size above. Set here to ~0.15 GiB:
#
#   in-flight window   64 × 256 KiB      = 16 MiB   (a GATE: nothing is dropped)
#   backlog byte cap                       128 MiB  (drop-oldest — see the warning)
#   outbound channel                       32 MiB   (QoS 0 shed only)
#
# Take max_inflight_messages FIRST: it is loss-free. max_backlog_bytes evicts entries
# that were already stored and ACKED, and the publisher is not told — the same
# ack-and-drop arm as queue_overflow, reached earlier. Keep it above max_packet_size
# (the broker warns otherwise) or one large message evicts the whole backlog and the
# eviction's on-loop truncate becomes a per-publish cost.
max_inflight_messages = 64
max_backlog_messages = 10000
max_backlog_bytes = 134217728
max_outbound_bytes = 33554432

max_subscriptions_per_client = 1000
# Per-connection publish rate; enforcement is TCP backpressure (pause), never a drop.
max_publish_rate = 500

# Process-memory WATERMARK (ADR 0041 T8): above it the broker browns out exactly as
# the disk mark does — growth refused, subscriber acks/reads/expiry/resumes continue,
# a QoS>=1 publisher refused rather than acked. 2.4 GiB is 80% of the ~3 GiB RSS
# budget on this 4 GiB machine; set the container limit to that ~3 GiB.
# NOT a ceiling: nothing here stops RSS rising. The mark is sampled, so RSS can
# overshoot it by watermark_poll_secs x the allocation rate — the 20% gap between this
# number and the container limit IS that allowance, and the container/cgroup limit
# remains the hard bound. Needs /proc (Linux).
memory_max_bytes = 2576980378

# How often BOTH watermark watchers sample, seconds (range 1-300; outside = startup
# error). Within 10% of either mark they re-check every poll/10, floor 1 s — which is
# also how fast a cleared brownout lifts. Lower this to shrink overshoot on a tight
# disk or memory budget; there is nothing to gain from raising it.
watermark_poll_secs = 10
