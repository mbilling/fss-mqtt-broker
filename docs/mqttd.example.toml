# mqttd example configuration (ADR 0046)
#
# Load with:  mqttd --config /etc/mqttd/mqttd.toml   (or set MQTTD_CONFIG=<path>)
# Validate:   mqttd --check-config --config /etc/mqttd/mqttd.toml   (binds nothing)
#
# Precedence (least to most specific):  defaults < this file < MQTTD_* env vars < CLI flags.
# Every setting here has a matching `MQTTD_*` environment variable (see the README) — the two
# surfaces never diverge (a CI test enforces the mapping). Unset = the secure default.
#
# The schema is STRICT: an unknown key or a wrong type fails the load with a located error,
# so a typo is caught at `--check-config` time, never silently ignored.
#
# Hot reload: edit this file and send SIGHUP (or set [runtime] config_watch_secs) to reload the
# whole config through the validate-before-swap path. Live-swappable settings (ACL/auth/TLS
# material, allow_anonymous, the state quotas) change without a restart; everything else is
# logged as "requires restart". A bad edit is rejected and the running config kept.
#
# SECRETS BY REFERENCE (ADR 0046 T5): this file is safe to commit to git / mount from a
# ConfigMap. All secret material is referenced BY PATH (TLS keys, password file, JWT keys, the
# gossip key) — mount those paths from a Kubernetes Secret. The only raw-secret-in-a-value option
# is the inline `[cluster.swim] key`; prefer `key_file` (below) to keep it out of the file too.

[node]
# Stable identifier for this node (default "node-local"). Must be unique per node.
id = "node-1"
# Directory for on-disk persistence (ADR 0018). With durable sessions on (the default) the lease
# group + replicated log live here and survive a full-cluster restart. Unset with durable
# on (the default) is REFUSED at startup unless [durable] allow_ephemeral opts in (#240).
data_dir = "/var/lib/mqttd"
# This node's failure-domain label (ADR 0016), advertised over gossip so the topology
# self-assembles. Unset = unlabelled (unless a peer or the static map below supplies one).
# failure_domain = "rack-a"
# Static failure-domain topology (cluster-uniform); per-node gossip labels override it.
# [node.failure_domains]  # e.g.  n1 = "rack-a"  ;  n2 = "rack-b"

[listeners]
# Every listener is opt-in; unset = that transport is off. TLS is the intended path.
tls_bind = "0.0.0.0:8883"            # MQTT over TLS 1.3 (needs [tls] cert + key)
# wss_bind = "0.0.0.0:8884"          # MQTT over WebSocket-Secure (reuses [tls])
# quic_bind = "0.0.0.0:8885"         # MQTT over QUIC (reuses [tls])
health_bind = "0.0.0.0:8080"         # GET /livez, /readyz, /metrics
# metrics_bind = "127.0.0.1:9090"    # optional separate /metrics bind (internal only)
# plaintext_bind = "127.0.0.1:1883"  # INSECURE — local testing only
# ws_bind = "127.0.0.1:8083"         # INSECURE plaintext WebSocket — local/dev only

[tls]
# Server certificate chain + private key (PEM paths). The key is a secret — mount it, don't
# inline it. Rotating the file and reloading serves the new cert on the next handshake.
cert = "/etc/mqttd/tls/server.crt"
key = "/etc/mqttd/tls/server.key"
# Require client certificates (mTLS); identity becomes the certificate CN.
client_ca = "/etc/mqttd/tls/client-ca.crt"
# Certificate revocation list (needs client_ca); a listed client is refused at the handshake and
# its live session is evicted on reload. Hot-reloads on SIGHUP.
# crl = "/etc/mqttd/tls/client.crl"
# TLS 1.3 session-resumption cache, per listener. Reconnecting clients resume with an
# abbreviated handshake — what keeps battery-powered fleets cheap. Default 32768 entries
# (rustls' own 256 is no resumption at fleet scale); size it to your fleet, or set 0 to
# disable resumption so every connection is fully re-verified.
# session_cache = 32768
# Admit TLS 1.2 clients on this listener — OFF by default, loudly logged while on.
# Only for device fleets whose firmware cannot negotiate 1.3; the cluster bus and QUIC
# are never affected. Even when on, 1.2 is HARDENED: ECDHE+AEAD suites only (no CBC/RC4/
# static-RSA — the classic exploit classes have no surface) and Extended Master Secret
# (RFC 7627) required, so triple-handshake attacks are refused at the handshake.
# allow_tls12 = true
# Relax the hardened posture for legacy clients that cannot do Extended Master Secret —
# OFF by default, loudly logged while on, an ERROR without allow_tls12. This reopens the
# triple-handshake surface for exactly those clients; plan its retirement.
# allow_unsafe_tls12_features = true

[security]
# Anonymous access is OFF by default and loudly logged when enabled — do not enable in prod.
allow_anonymous = false
# Argon2id `username:phc-hash` password file (a secret — mount it).
# password_file = "/etc/mqttd/passwd"
# TOML topic-ACL policy (deny by default). Without it, authorization is NOT enforced (logged).
acl_file = "/etc/mqttd/acl.toml"

# Remote HTTP authentication hook (ADR 0004 T16). The broker POSTs
# {client_id, username, password, method} and reads the HTTP STATUS as the verdict:
#   200 = allow (an optional {"groups":[...]} body enriches the identity)
#   401/403 = deny
#   anything else, a timeout, or an unreachable host = DENY (fail closed)
# One hook reaches LDAP / OAuth2 / a bespoke user table with no broker integration per
# backend. Tried AFTER the local password file, so a user in both costs no round trip.
# [security.http_auth]
# url = "https://auth.internal.example/mqtt"
# timeout_secs = 5          # the ONLY bound on how long a CONNECT waits; expires closed
# cache_secs = 0            # cache ACCEPTED credentials for N seconds (0 = off).
#                           # Rejections are never cached: a fixed password takes effect
#                           # at once, and caching denials outlasts the outage.
# cache_max = 10000         # bounded — the cache is filled from a network-facing path
# allow_http = false        # INSECURE: the password crosses this link
# Per-round enhanced-auth reply timeout, seconds (default 10).
# auth_timeout_secs = 10

[security.jwt]
# JWT verification key. HS256 secret and RS256 public key are both referenced BY FILE (T5).
# hs256_secret_file = "/run/secrets/jwt-hs256"   # the HMAC secret, from a Secret mount
# rs256_pem_file = "/etc/mqttd/jwt-rs256.pem"    # the RSA public key (PEM)
# issuer = "https://issuer.example"              # optional `iss` constraint
# audience = "mqttd"                             # optional `aud` constraint

[security.auth_penalty]
# Auth-failure penalty box (ADR 0041 T2): after `threshold` failures from one source address,
# its connections are closed at accept until the strikes decay. Keys on the address, never the
# username. Unset threshold = disabled.
# threshold = 10
# decay_secs = 60

[cluster]
# Inter-node peer listener + the cluster-bus mTLS material (set all three of ca/cert/key, or none
# for a loudly-logged plaintext mesh). The key is a secret — mount it.
peer_bind = "0.0.0.0:7001"
# peer_advertise = "node-1.mqttd.svc:7001"   # address peers dial, if it differs from the bind
#
# THIS CERTIFICATE IS PER NODE, and four rules make it so. Three of them fail at RUNTIME, not
# when the certificate is issued, and one shared certificate breaks all of them at once:
#   1. Subject CN == this node's `[node] id`. A peer may only claim the id its certificate
#      attests to; a mismatch logs "peer Hello node id does not match its certificate Common
#      Name" and drops the link, so a shared CN drops EVERY link.
#   2. A SAN covering the HOST PART of this node's peer_advertise — that is what a dialing peer
#      verifies. SANs only: the CN above satisfies rule 1 and nothing about name verification.
#   3. BOTH serverAuth and clientAuth EKUs — every node dials as well as being dialed.
#   4. An ECDSA P-256/P-384 or Ed25519 key in PKCS#8, never RSA: this key is ALSO the per-node
#      gossip signing key (`signed`, below), and that signer accepts nothing else. RSA gives a
#      working TLS handshake and then a startup failure about the gossip signing key.
[cluster.peer_tls]
# ca = "/etc/mqttd/cluster/ca.crt"
# cert = "/etc/mqttd/cluster/node.crt"       # THIS node's leaf — CN = [node] id (rules 1-4)
# key = "/etc/mqttd/cluster/node.key"        # ECDSA/Ed25519 PKCS#8, not RSA (rule 4)
# crl = "/etc/mqttd/cluster/node.crl"        # cluster-CA-signed; hot-reloads

[cluster.swim]
# SWIM gossip membership (needs [cluster] peer_bind). Seeds = existing members to join through;
# a node with no seeds founds the lease group (exactly one founder per cluster).
bind = "0.0.0.0:7946"
seeds = ["node-2.mqttd.svc:7946", "node-3.mqttd.svc:7946"]
# The 64-hex gossip key. Prefer key_file (secret-by-reference) over the inline key; setting both
# is an error. `openssl rand -hex 32` generates one.
key_file = "/run/secrets/swim-key"
# key = "0123...cdef"                          # inline alternative (a raw secret in this file)
# key_accept = ["<old-hex>"]                   # extra keys accepted during a zero-downtime rotation
# signed = "require"                           # per-node gossip signatures (needs peer_tls + a key)
# replay = "require"                           # anti-replay (needs signed=require + data_dir)

[durable]
# Durable, consensus-backed replicated session storage is ON by default (ADR 0029). Set false for
# the lightweight in-memory store (an explicit choice — it never needs allow_ephemeral below).
enabled = true
# Permit durable-on with NO [node] data_dir (issue #240) — OFF by default: without it that
# combination REFUSES to start (and fails --check-config and a live reload), because the
# replicated state would live only in memory and a correlated quorum restart loses acked
# messages. Dev/tests only; loudly WARNed on every start while on. Env: MQTTD_ALLOW_EPHEMERAL_DURABILITY.
# allow_ephemeral = true
# Bounded lease-consensus voter set size (default 5, recommend odd). Note: >=5 durable nodes on a
# SINGLE host is fsync-bound (see the demo sizing note / ADR 0049).
lease_voters = 5
# Disk high-water cap over the on-disk stores, bytes (needs [node] data_dir). Above it the broker
# browns out growth-writes while subscriber acks/deletes/resumes continue; a QoS>=1 publisher is
# REFUSED (v5 0x97 / v3.1.1 no ack + close; cross-node via a peer-bus verdict — mid-rolling-upgrade
# an older link withholds the ack and closes instead) — an answered refusal, never a silent drop;
# re-sending is the application's decision. Unset = no watermark.
# store_max_bytes = 10737418240
# Min-replicas write floor (issues #167, #239). Replica sets shrink with membership —
# min(R, alive) — so without a floor a shrinking cluster silently trades the configured
# durability for availability, down to quorum-of-1. A group below the floor REFUSES durable
# writes instead (QoS>=1 acks withheld so sources redeliver; retained mutations queue until
# capacity returns; reads, QoS 0 and acked-driven truncation/removal keep serving — but QoS 2
# in-flight bookkeeping writes durable state, so it is refused with everything else).
#
# The default, shown here, is the DERIVED majority floor: a majority of the members this node
# knows about — the quorum-committed durable roster is authoritative, the largest membership it
# has ever observed is a fallback used only before a roster exists, and
# [runtime].ready_min_members bounds the result from below — capped at the replication factor. That is no floor at
# all while the node has never known a peer (a single node stays fully operational) and 2 copies
# in a 3-node cluster, which the write quorum already needs, so a one-at-a-time roll is unaffected.
# The cap also keeps it at 2 in a wider topology: on 5 or 7 nodes a group down to 2 copies still
# commits. With [durable].enabled = false there is no durable plane and no floor at all.
#
# ROLLBACK NOTE (ADR 0058 §E): the word form below is a value shape the PREVIOUS release cannot
# parse (it expects an integer), and a type mismatch is a hard error that
# [runtime].config_unknown_keys = "warn" does not rescue. Pre-1.0 that is allowed; if you need this
# file to stay readable by the release you might roll back to, spell the floor as an integer or
# leave the key out entirely and take the same default.
min_replicas = "majority"
# min_replicas = 1  # opt out: accept single-copy acks (single-node dev; a shrink to one member, or
#                   # an unconsented loss of the rest — see docs/TROUBLESHOOTING.md and
#                   # docs/OPERATIONS.md "Scaling". A [durable] edit: restart, not SIGHUP)
# min_replicas = 2  # an absolute floor on the replica-set SIZE, whatever the topology says (cannot
#                   # exceed R = 3). It bounds the SET, not the acks: the write quorum is still
#                   # len/2+1, so min_replicas = 3 over a 3-member set commits once 2 copies hold
#                   # the record. The derived default above has no such gap (a set of 2 or 3 needs
#                   # 2 acks and the floor is 2).
#
# Watch it via the replication_min_actual / replication_desired / replication_write_floor gauges
# and the /statusz "replication" block (which also reports write_floor_source: derived|configured).
# The symptom when it fires: QoS>=1 publishers stop getting PUBACKs (docs/TROUBLESHOOTING.md).

[limits]
# Resource governance (ADR 0041). Unset generally = uncapped. A configured 0 where a positive
# value is required is a startup error.
# Sizing a machine with a fixed RAM/disk budget: docs/SIZING.md has the arithmetic and
# docs/examples/bounded-node.toml is a fully-set preset for a 4 GiB / 20 GiB node.
# max_connections = 100000
# max_connections_per_ip = 1000
# max_sessions = 500000
# max_subscriptions_per_client = 1000
# max_retained_messages = 100000
# max_publish_rate = 10000            # msgs/sec per connection; over-rate = socket backpressure
max_queued_messages = 100000         # per-session offline queue (default 100000)
queue_overflow = "drop-oldest"       # or "reject-newest"
# max_packet_size = 1048576          # inbound ceiling, bytes (default 1 MiB, floor 1 KiB)
# receive_maximum = 256              # v5 Receive Maximum (default 256, floor 1)
# topic_alias_max = 16               # v5 Topic Alias Maximum (default 16; 0 disables)
# Process-memory high-water mark, bytes (ADR 0041 T8). Above it the broker enters BROWNOUT:
# growth writes (new sessions, new retained topics, offline enqueues) are refused while subscriber
# acks, reads, deletes, expiry and resumes continue; a QoS>=1 publisher is REFUSED (v5 0x97 /
# v3.1.1 no ack + close; cross-node via a peer-bus verdict — mid-rolling-upgrade an older link
# withholds the ack and closes instead) — an answered refusal; re-sending is the application's
# decision. Unset = off.
# A watermark, NOT a ceiling: nothing here stops memory rising, so keep the container/cgroup
# memory limit as the hard bound. This buys warning instead of an OOM kill.
# Requires /proc (Linux); elsewhere the broker logs that it is not enforcing and carries on.
# memory_max_bytes = 2147483648      # 2 GiB

[observability]
# OTLP/HTTP push export (ADR 0020). Unset = Prometheus /metrics endpoint only.
# otlp_endpoint = "http://collector:4318"
otlp_interval_secs = 10

[runtime]
# Graceful-shutdown drain window, seconds (default 30; 0 = drain immediately).
shutdown_grace_secs = 30
# Smallest mesh size /readyz accepts (default 1). Raise to hold a node out of rotation until it
# has joined its peers.
ready_min_members = 1
# Filesystem config-watch poll interval, seconds (default 0 = signal-only). Set it to auto-reload
# this file (and the referenced policy files) on change — the Kubernetes ConfigMap case.
# config_watch_secs = 5
# Unknown-config-key policy (ADR 0058 T4). Default "refuse": a key this broker version does not
# know fails the load, every unknown key listed — the typo net. Set "warn" (or
# MQTTD_CONFIG_UNKNOWN_KEYS=warn) so a config written for a NEWER broker still boots this one —
# the rollback / mixed-version-fleet window — with each ignored key logged loudly. While "warn"
# is set, typos are ignored too: prefer setting it only for the skew window, and keep the
# check-config gate strict.
# config_unknown_keys = "refuse"
