## FIXTURE PROVENANCE — COMPOSED. NOT VERBATIM VENDOR CONFIGURATION.
## Read this before changing a line.
##
## For the verbatim vendor article, see emqx-6.2.2-vendor-verbatim.conf: the ten cited
## example files concatenated byte for byte, with their SHA-256s in its header. THIS
## file is derived from the same vendor material and then DELIBERATELY CHANGED, and the
## table below lists every change. It exists because EMQX's stock defaults take the
## NEGATIVE branch of nearly every security mapping, so a purely verbatim fixture can
## only prove the converter's refusals — never that a positive mapping fires correctly.
##
## Base material, fetched 2026-08-14 via the GitHub contents API from
##   https://github.com/emqx/emqx/tree/6.2.2/rel/config/examples
##   node.conf.example, listeners.tcp.conf.example, listeners.ssl.conf.example,
##   listeners.ws.conf.example, listeners.quic.conf.example, mqtt.conf.example,
##   retainer.conf.example, cluster-with-static.conf.example, rate_limit.conf.example
## concatenated the way EMQX's own documentation tells an operator to compose emqx.conf,
## with the vendor's comments trimmed for length and 53 vendor keys dropped: 50 the
## converter has nothing to say about (tcp_options tuning, hibernate_after, log_level,
## proxy_protocol, the websocket deflate_opts, …) plus the three named below — the ws and
## quic `max_connections` and quic's `enable_authn`. Counted, not estimated: parse this
## file and the ten-part vendor concatenation with the converter's own HOCON reader and
## diff the leaf sets (done 2026-08-14; the wss listener's 48 keys are outside the count
## because this fixture omits that file entirely, as stated above).
##
## ── EVERY VALUE THAT DIFFERS FROM WHAT THE VENDOR SHIPS ────────────────────────────
## Re-fetched and diffed key by key on 2026-08-14. Nine values differ, and each one is
## here to switch a specific mapping ON so the test can assert it. (A mechanical diff of
## the two leaf sets reports EIGHT differing paths: the ninth is the quic `ciphers` value,
## whose path differs too because that listener was renamed — see the NAME note below.)
##
##  key                                              vendor        here        why
##  listeners.ssl…ssl_options.verify                 verify_none   verify_peer  ┐ together
##  listeners.ssl…ssl_options.fail_if_no_peer_cert   false         true         ┘ these two
##      are the ONLY input that may become `[tls] client_ca`. At the vendor's values the
##      converter must REFUSE the mandate and emit client_ca commented out; at these it
##      must map it. Both branches need a fixture, and this is the mapping half.
##  mqtt.peer_cert_as_username                       disabled      cn
##      unlocks `[security] mtls_identity_source = "cn"`.
##  retainer.backend.max_retained_messages           0             100000
##      0 means UNLIMITED in EMQX and comes out as a NOTE, not a number; a real cap is
##      what exercises `[limits] max_retained_messages`.
##  listeners.tcp…max_connections                    infinity      1000000
##  listeners.ssl…max_connections                    infinity      500000
##      `infinity` comes out as a NOTE with nothing set; two finite values that DIFFER
##      is what exercises the smallest-wins collapse onto one node-wide cap — mqttd has
##      ONE node-wide cap, so the converter must take the SMALLER (500000) and say that it
##      did. (Both values were 1000000 until 2026-08-14, i.e. equal, so this fixture's
##      stated purpose was not actually exercised and the collapse TODO never fired;
##      test-from-emqx.sh now asserts both the number and the TODO.)
##  listeners.ssl…ssl_options.ocsp.enable_ocsp_stapling  false     true
##      mqttd has no OCSP stapling; `true` is what makes the TODO fire.
##  listeners.ssl…ssl_options.ciphers                3 suites      first 2
##  listeners.quic…ciphers                           3 suites      first 1
##      shortened for line length only — no mapping depends on either.
##
## And one NAME differs: the vendor's QUIC listener is `my_quick_listener_name` (a typo
## the vendor ships); it is `my_quic_listener_name` here. The verbatim fixture keeps the
## vendor's spelling.
##
## Also dropped, relative to the vendor: `max_connections` is absent from the ws and
## quic listeners here (the vendor sets `infinity` on both), so that the smallest-wins
## collapse is decided by exactly the two listeners named above.
##
## ── BLOCKS WITH NO VENDOR EXAMPLE FILE AT ALL — written here ───────────────────────
## `authentication` and `authorization` are the shape documented at docs.emqx.com
## (authn mechanisms/backends, authz sources); EMQX ships those managed from the
## dashboard and persisted to data/configs/cluster.hocon, so there is no example file
## to copy. `rule_engine`, `bridges.mqtt`, `exhook` and `dashboard` are likewise written
## here, in the shape those subsystems' documentation shows, to exercise the
## no-equivalent reporting (a rule-engine rule, the one bridge type that DOES map, a
## hook server, the dashboard). No value in any of these SIX blocks is attributable to
## a vendor example file, and none should be quoted as one.
##
## NO LIVE EMQX BROKER WAS RUN to produce this file, and no ground-truth config from
## one was used. It exercises the converter's mapping surface and its TODO(migrate)
## paths; it is not evidence that a real EMQX deployment converts cleanly.

node {
    name = "emqx@127.0.0.1"
    cookie = "Yzc0NGExM2Rj"
    max_ports = 1048576
    dist_buffer_size = 8192
    data_dir = "data"
    global_gc_interval = 15m
}

cluster {
    name = emqxcl
    discovery_strategy = static
    autoheal = true
    static.seeds = ["emqx1@192.168.0.1", "emqx2@192.168.0.2"]
}

listeners.tcp.my_tcp_listener_name {
    bind = 1883
    proxy_protocol = false
    enable_authn = true
    access_rules = ["allow all"]
    acceptors = 16
    max_connections = 1000000
    max_conn_rate = "1000/s"
    messages_rate = "1000/s"
    bytes_rate = "1MB/s"
    tcp_options {
        backlog = 1024
        nodelay = true
    }
}

listeners.ssl.my_ssl_listener_name {
    bind = 8883
    acceptors = 16
    enable_authn = true
    max_connections = 500000
    mountpoint = ""
    ssl_options {
        cacertfile = "${EMQX_ETC_DIR}/certs/cacert.pem"
        certfile = "${EMQX_ETC_DIR}/certs/cert.pem"
        keyfile = "${EMQX_ETC_DIR}/certs/key.pem"
        verify = verify_peer
        fail_if_no_peer_cert = true
        reuse_sessions = true
        depth = 10
        versions = [tlsv1.3, tlsv1.2]
        ciphers = "TLS_AES_256_GCM_SHA384,TLS_AES_128_GCM_SHA256"
        handshake_timeout = 15s
        ocsp {
             enable_ocsp_stapling = true
             responder_url = "http://ocsp.example.com"
        }
    }
}

listeners.ws.my_ws_listener_name {
    bind = "0.0.0.0:8083"
    enable_authn = true
    websocket {
        mqtt_path = "/mqtt"
        supported_subprotocols = "mqtt, mqtt-v3, mqtt-v3.1.1, mqtt-v5"
        compress = false
        max_frame_size = infinity
    }
}

listeners.quic.my_quic_listener_name {
    bind = 14567
    acceptors = 16
    ciphers = "TLS_AES_256_GCM_SHA384"
    ssl_options {
        cacertfile = "data/certs/cacert.pem"
        certfile = "data/certs/cert.pem"
        keyfile = "data/certs/key.pem"
        verify = verify_none
    }
}

mqtt {
    idle_timeout = 15s
    max_packet_size = 1MB
    max_clientid_len = 65535
    max_topic_levels = 128
    max_qos_allowed = 2
    max_topic_alias = 65535
    retain_available = true
    wildcard_subscription = true
    shared_subscription = true
    exclusive_subscription = false
    ignore_loop_deliver = false
    strict_mode = false
    server_keepalive = disabled
    keepalive_multiplier = 1.5
    max_subscriptions = infinity
    upgrade_qos = false
    max_inflight = 32
    retry_interval = 30s
    max_awaiting_rel = 100
    await_rel_timeout = 300s
    session_expiry_interval = 2h
    message_expiry_interval = infinity
    max_mqueue_len = 1000
    mqueue_store_qos0 = true
    use_username_as_clientid = false
    peer_cert_as_username = cn
    peer_cert_as_clientid = disabled
    shared_subscription_strategy = round_robin
}

retainer {
    msg_expiry_interval = 5s
    max_payload_size = 1MB
    stop_publish_clear_msg = false
    delivery_rate = "1000/s"
    backend {
      type = built_in_database
      storage_type = ram
      max_retained_messages = 100000
     }
 }

## Documented HOCON shape (docs.emqx.com): an ORDERED chain of authenticators.
authentication = [
    { mechanism = password_based, backend = built_in_database, password_hash_algorithm { name = sha256, salt_position = suffix } },
    { mechanism = password_based, backend = mysql, server = "mysql:3306", database = mqtt, query = "SELECT password_hash FROM mqtt_user WHERE username = ${username}" },
    { mechanism = jwt, use_jwks = false, algorithm = "hmac-based", secret = "emqxsecret", verify_claims = { username = "${username}" } }
]

authorization {
    no_match = deny
    deny_action = ignore
    cache { enable = true, max_size = 32, ttl = 1m }
    sources = [
        { type = file, enable = true, path = "etc/acl.conf" },
        { type = built_in_database, enable = true },
        { type = http, enable = true, url = "http://authz:8080/acl", method = post }
    ]
}

## A rule-engine rule and an MQTT bridge: the first has NO mqttd equivalent at all,
## the second is the only bridge type that maps.
rule_engine {
    rules.my_rule {
        sql = "SELECT * FROM \"t/#\" WHERE payload.temp > 50"
        actions = ["mqtt:my_mqtt_bridge"]
    }
}

bridges.mqtt.my_mqtt_bridge {
    server = "broker.emqx.io:1883"
    username = "emqx-bridge"
    password = "not-copied-by-the-converter"
    ingress {
        remote { topic = "aws/#", qos = 1 }
        local { topic = "from_aws/${topic}" }
    }
    egress {
        local { topic = "emqx/#" }
        remote { topic = "from_emqx/${topic}", qos = 1 }
    }
}

exhook {
    servers = [ { name = "hook1", url = "http://127.0.0.1:9000" } ]
}

dashboard {
    listeners.http { bind = 18083 }
}
