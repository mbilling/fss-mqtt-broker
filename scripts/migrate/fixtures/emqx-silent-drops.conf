## FIXTURE PROVENANCE — an ADVERSARIAL fixture, written for this repository.
##
## This is NOT vendor-shipped configuration. It was written on 2026-08-14 to pin the
## SILENT DROPS the review of that date found, one block per drop, so that each of them
## fails this fixture's test if it ever comes back. Key NAMES are spelled as EMQX 6.2.2
## spells them (https://github.com/emqx/emqx/tree/6.2.2); the values were chosen here.
##
## What each block proves:
##  1. A SECOND TLS LISTENER'S ssl_options ARE READ. The two listeners below carry
##     IDENTICAL cert/key/CA material, which is what made the drop invisible: the
##     "different TLS material" TODO stayed silent, and because the reporting loop only
##     walked the FIRST listener's keys, `verify = verify_none`, `versions = [tlsv1.2]`,
##     `enable_crl_check = true`, `depth` and `ssl_options.password` all disappeared from
##     the output with no TODO at all. A revocation check and a TLS-1.2 acceptance
##     vanishing in silence is the fail-open direction on the most security-relevant
##     construct there is.
##  2. THE mTLS POSTURE IS DECIDED ACROSS LISTENERS. `ssl.devices` REQUIRES a client
##     certificate; `wss.browsers` does not. mqttd has ONE [tls] table for tls_bind,
##     wss_bind and quic_bind, so neither mapping client_ca (which newly demands certs
##     from browsers) nor dropping it (which loses the device mandate) is a translation:
##     the candidate must be COMMENTED OUT with a TODO naming both listeners.
##  3. `max_connections = infinity` IS REPORTED. It is the vendor's shipped default in
##     every listener example, and it used to be skipped with a bare `continue` — no
##     NOTE, no trace — while the identically shaped case on a DIRECT-mapped key got a
##     NOTE a few hundred lines away.
##  4. `mqtt.max_inflight` IS NOT MAPPED. It looks like [limits] receive_maximum and is
##     the OPPOSITE direction (EMQX bounds broker->client; mqttd's is the inbound window
##     it grants clients), so mapping it cut the inbound window from 256 to 32 on every
##     stock conversion.
##  5. EVERY BRIDGE KEY IS REPORTED. The bridge below carries a payload TEMPLATE and two
##     RETAIN overrides beside its topics: a payload template is a data transformation and
##     mqtt-bridge forwards payloads byte for byte, so dropping it silently changes the
##     message shape the far side receives. They used to vanish under a section-level
##     count whose text told the operator the bridge had been translated.
##  6. AN UNREADABLE ACL SOURCE. `authorization.sources` names the RELATIVE path EMQX
##     itself ships, so running the converter anywhere but the EMQX install root cannot
##     read it — the DEFAULT outcome, not an edge case. The gap must appear in the files
##     the operator is about to deploy, not only on stderr.
##  7. A DISABLED LISTENER IS NOT BOUND (added 2026-08-15). `enable` is a real
##     base_listener field in the vendor's own schema (apps/emqx/src/emqx_schema.erl
##     base_listener/1 at 6.2.2, default true, alias `enabled`) and it was UNREAD, so a
##     listener the operator had switched OFF became a live mqttd bind. It is the one flip
##     that opens a network port, and mqttd's only runtime signal is an INSECURE warning.
##     `listeners.tcp.retired_plain` below is switched off and must leave a TODO naming it
##     without producing a plaintext_bind.
##  8. THE v2 BRIDGE SHAPE IS TRANSLATED (added 2026-08-15). `bridges` is NOT a root in
##     6.2.2's schema — emqx_conf_schema:roots/0 and emqx_bridge_v2_schema:roots/0 give
##     `connectors`, `actions` and `sources`, and `bridges.*` survives only through the
##     vendor's v1 upgrade path (emqx_bridge_compatible_config). So the v1 block above is
##     the LEGACY case and the `connectors` + `actions` + `sources` blocks below are the
##     shape a current EMQX writes: the connector carries the address, the action carries
##     `local_topic` + `parameters.topic`, the source carries `parameters.topic`. Before
##     this the v2 shape produced an upstream with ZERO rules — forwarding nothing — while
##     the section TODO said MQTT-type actions map to mqtt-bridge rules.
##
## NO LIVE EMQX BROKER WAS RUN to produce this file.

node {
    name = "emqx@10.0.0.8"
}

listeners.ssl.devices {
    bind = 8883
    max_connections = infinity
    ssl_options {
        certfile = "/etc/emqx/certs/cert.pem"
        keyfile = "/etc/emqx/certs/key.pem"
        cacertfile = "/etc/emqx/certs/ca.pem"
        verify = verify_peer
        fail_if_no_peer_cert = true
        password = "not-copied-either"
    }
}

listeners.wss.browsers {
    bind = 8084
    max_connections = infinity
    ssl_options {
        ## IDENTICAL material to the listener above — that is the point.
        certfile = "/etc/emqx/certs/cert.pem"
        keyfile = "/etc/emqx/certs/key.pem"
        cacertfile = "/etc/emqx/certs/ca.pem"
        verify = verify_none
        versions = [tlsv1.2]
        enable_crl_check = true
        depth = 3
    }
}

mqtt {
    max_inflight = 32
}

bridges.mqtt.to_cloud {
    server = "cloud.example.com:8883"
    bridge_mode = true
    clean_start = false
    proto_ver = v5
    resource_opts { batch_size = 100, query_mode = async }
    egress {
        local { topic = "sensors/#", retain = true }
        remote { topic = "from_edge/${topic}", qos = 1, retain = false, payload = "{\"ts\":${timestamp},\"v\":${payload}}" }
    }
}

## A listener the operator switched OFF. Enabling it would open port 1884.
listeners.tcp.retired_plain {
    enable = false
    bind = "0.0.0.0:1884"
}

## The v2 bridge shape: connector + action + source, as EMQX 6.x writes it.
connectors.mqtt.regional {
    server = "regional.example.com:1883"
    username = "edge-bridge"
    password = "not-copied-either"
}

actions.mqtt.push_telemetry {
    connector = "regional"
    local_topic = "telemetry/#"
    parameters { topic = "edge/${topic}", qos = 1, retain = false, payload = "${.payload}" }
}

sources.mqtt.pull_commands {
    connector = "regional"
    local_topic = "downlink/${topic}"
    parameters { topic = "commands/#", qos = 1 }
}

authorization {
    no_match = deny
    sources = [ { type = file, enable = true, path = "etc/acl.conf" } ]
}
