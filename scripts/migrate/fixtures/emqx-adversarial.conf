##  3. SECURITY-POSTURE TRAPS — a TLS listener with a cacertfile but verify_none, and a
##     SECOND tcp listener. Neither may be translated: mapping cacertfile onto client_ca
##     would silently mandate mTLS, and mqttd has one bind per protocol.
##  4. MALFORMED INPUT — the unterminated `broken_block {` at the end must not raise.
