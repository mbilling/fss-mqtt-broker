## NO LIVE EMQX BROKER WAS RUN to produce this file.

node {
    name = "emqx@10.0.0.1"
}

listeners.tcp.first { bind = 1883 }
listeners.tcp.second { bind = "127.0.0.1:11883" }
listeners.tcp.third { bind = 21883 }

listeners.ssl.optional_certs {
    bind = 8883
    ssl_options {
        cacertfile = "/etc/emqx/certs/ca.pem"
        certfile = "/etc/emqx/certs/cert.pem"
        keyfile = "/etc/emqx/certs/key.pem"
        ## The trap: peer verification is OFF, so a client certificate is OPTIONAL.
        ## mqttd's client_ca MANDATES mTLS — mapping this would break every client
        ## that does not present one.
        verify = verify_none
        fail_if_no_peer_cert = false
    }
}

## A transport mqttd does not have at all.
listeners.dtls.my_dtls { bind = 9883 }

mqtt {
    max_packet_size = 4MB
    ## Unknown key: must be reported by path, not ignored.
    no_such_setting_at_all = 42
    ## A unit the normaliser does not know: must be reported, never guessed.
    max_mqueue_len = "many"
}

## Entire subsystems with no mqttd equivalent.
rule_engine {
    rules.r1 { sql = "SELECT * FROM \"#\"", actions = ["console"] }
    rules.r2 { sql = "SELECT * FROM \"t/#\"", actions = ["mqtt:nowhere"] }
}

gateway.coap {
    mountpoint = "coap/"
    connection_required = false
}

plugins {
    states = [ { name_vsn = "my_plugin-1.0.0", enable = true } ]
}

exhook {
    servers = [ { name = "h1", url = "http://127.0.0.1:9000" } ]
}

zones.my_zone {
    mqtt { max_topic_alias = 10 }
}

## A section that does not exist in any EMQX version.
wildly_invented_section {
    some_key = "some value"
    nested { deeper = true }
}

## Authorization that FLIPS the default open — faithful, and it must be flagged loudly.
authorization {
    no_match = allow
    sources = [ { type = file, path = "etc/acl.conf" } ]
}

