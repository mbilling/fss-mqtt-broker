%% FIXTURE PROVENANCE — PART COPIED, PART COMPOSED. Read this before changing a line.
%%
%% Source for the copied rules: the EXPLANATORY EXAMPLES inside EMQX's own shipped
%% acl.conf at tag 6.2.2 (the "%% For example, ..." lines in its documentation block),
%%   https://github.com/emqx/emqx/blob/6.2.2/apps/emqx_auth/etc/acl.conf
%% fetched 2026-08-14 via the GitHub contents API and re-fetched and diffed rule by rule
%% on 2026-08-14. Three of the six rules are the vendor's; three were written here.
%%
%%   COPIED FROM THE VENDOR  (line in the fetched acl.conf)
%%     line  97  {allow, {username, "Jon"}, subscribe, ["#"]}          — verbatim
%%     line 129  {allow, {username, "Jan"}, publish, ["jan/#"]}        — verbatim
%%     line 135  {allow, all, publish, "${clientid}/#"}                — the vendor's
%%               prose writes the topic BARE; it is bracketed to ["${clientid}/#"] here,
%%               because a bare topic is a documentation shorthand and the list form is
%%               what a real acl.conf carries.
%%
%%   COMPOSED HERE — no vendor rule says this, and none should be cited as though it did
%%     {allow, {username, "sensor-1"}, publish, ["devices/${username}/telemetry"]}
%%               the vendor documents ${username} as a supported placeholder (line 139)
%%               but ships no rule using it; this one exercises the ${username} -> %i
%%               translation.
%%     {allow, {username, "Jan"}, {publish, [{qos,0},{retain,false}]}, ["jan/lowqos/#"]}
%%               built around the vendor's `{publish, [{qos,0},{retain,false}]}` action
%%               FRAGMENT (line 123), which appears in prose only, never as a whole rule.
%%     {deny, all, subscribe, ["secret/#"]}
%%               written here to create an allow/deny OVERLAP, so the first-match-wins
%%               vs deny-wins warning has something to fire on.
%%
%% WHY IT EXISTS: the vendor's shipped DEFAULT rules (see emqx-acl-6.2.2.conf, which IS
%% verbatim) all land on gaps in mqttd's ACL model, so they prove the TODO(migrate) paths
%% and nothing else. This file is the other half — rules that genuinely translate, beside
%% two that must NOT be translated silently (the {qos,retain} action qualifier mqttd
%% cannot express, and the ordering-semantics change) — and getting that coverage
%% requires composing rules the vendor never shipped. Composition is fine; calling it
%% "copied from the vendor" was not.
%%
%% NO LIVE EMQX BROKER WAS RUN to produce this file.

%% Vendor example: "`{allow, {username, "Jon"}, subscribe, ["#"]}` allows Jon to
%% subscribe to any topic they want."
{allow, {username, "Jon"}, subscribe, ["#"]}.

%% Vendor example: "`{allow, {username, "Jan"}, publish, ["jan/#"]}` permits Jan to
%% publish to any topic matching the wildcard pattern "jan/#"."
{allow, {username, "Jan"}, publish, ["jan/#"]}.

%% Vendor example (bracketed here; the vendor's prose writes the topic bare): "`{allow,
%% all, publish, "${clientid}/#"}` allows all clients to publish to topics prefixed by
%% their own client ID."
{allow, all, publish, ["${clientid}/#"]}.

%% COMPOSED HERE — not a vendor rule. The vendor lists ${username} as a supported
%% placeholder but ships no rule using it; this exercises ${username} -> %i.
{allow, {username, "sensor-1"}, publish, ["devices/${username}/telemetry"]}.

%% COMPOSED HERE — not a vendor rule. Built around the vendor's action FRAGMENT, which
%% appears in prose only: "`{publish, [{qos,0},{retain,false}]}` should only match the
%% `publish` action when the message has QoS 0, and without retained flag set." mqttd
%% rules carry no qos/retain qualifier, so this must be reported as broadening.
{allow, {username, "Jan"}, {publish, [{qos, 0}, {retain, false}]}, ["jan/lowqos/#"]}.

%% COMPOSED HERE — not a vendor rule. A deny that OVERLAPS the allow rules above. Under
%% EMQX's first-match-wins order the earlier allows shadow it; under mqttd's deny-wins
%% they do not. The converter must say so.
{deny, all, subscribe, ["secret/#"]}.
