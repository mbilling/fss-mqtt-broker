## FIXTURE PROVENANCE — an ADVERSARIAL fixture, written for this repository.
##
## This is NOT vendor-shipped configuration. It was written on 2026-08-14 for the
## remediation of the 2026-08-14 review, and every value in it was chosen here. Key
## NAMES are spelled as EMQX 6.2.2 spells them
## (https://github.com/emqx/emqx/tree/6.2.2); the VALUES are hostile on purpose.
##
## What each block proves:
##  1. TOML ESCAPING — Windows-style certificate paths and a Windows data_dir. Before
##     the fix, `certfile = "C:\\emqx\\certs\\cert.pem"` came out as
##     `cert = "C:\emqx\certs\cert.pem"`, which tomllib REJECTS ("invalid escape
##     sequence") — so the whole generated config was unloadable and
##     `mqttd --check-config` failed on the converter's own output. AD/Windows estates
##     are exactly the populations being migrated, so this is the default case, not an
##     exotic one. The paired ACL fixture (emqx-acl-hostile-strings.conf) does the same
##     for a `CORP\jdoe` username and a topic containing a double quote.
##  2. THE POSITIVE mTLS GATE — ONE TLS listener with verify = verify_peer AND
##     fail_if_no_peer_cert = true, which is the only shape where cacertfile may become
##     [tls] client_ca. Deleting that gate must make this fixture's test fail.
##  3. `enable = false` ON AN AUTHENTICATOR — the http authenticator below was switched
##     OFF in EMQX (which is how the dashboard decommissions one without deleting it).
##     Translating it as if it were live would ENABLE it: the migrated broker would
##     consult a legacy endpoint the operator believes is off, and an endpoint still
##     answering 200 under a different contract would admit every client.
##  4. `enable = false` ON AN AUTHORIZATION SOURCE — same trap, one section over: a
##     disabled file source is not the live policy and must not be presented as one.
##
## NO LIVE EMQX BROKER WAS RUN to produce this file.

node {
    name = "emqx@10.0.0.9"
    data_dir = "C:\\emqx\\data"
}

listeners.ssl.windows_devices {
    bind = 8883
    ssl_options {
        certfile = "C:\\emqx\\certs\\cert.pem"
        keyfile = "C:\\emqx\\certs\\key.pem"
        cacertfile = "C:\\emqx\\certs\\ca.pem"
        ## Both halves set: a client certificate is MANDATORY, so mapping cacertfile
        ## onto client_ca changes nothing about the posture.
        verify = verify_peer
        fail_if_no_peer_cert = true
    }
}

## A DISABLED authenticator. EMQX did not consult this endpoint.
authentication = [
    { mechanism = password_based, backend = http, enable = false, url = "http://legacy-authn:8080/auth", request_timeout = 5s }
]

## A DISABLED authorization source. These rules were not in force.
authorization {
    no_match = deny
    sources = [
        { type = file, enable = false, path = "etc/acl-that-was-switched-off.conf" }
    ]
}
