# The admin-API end-to-end cluster (scripts/admin-e2e.sh copies this into its state
# directory, next to the generated pki/ and per-node cfgN/). Three nodes with cluster
# mTLS and the admin API on 9443; MQTT, admin and health published as N1883, N9443, N8080.
name: mqttd-admin-e2e

x-node: &node
  image: ${IMAGE:-mqttd-admin-e2e:latest}
  command: ["--config", "/cfg/mqttd.toml"]
  volumes:
    - ./pki:/e2e/pki:ro
    - ./acl.toml:/e2e/acl.toml:ro

services:
  mqttd-1:
    <<: *node
    hostname: mqttd-1
    environment:
      MQTTD_NODE_ID: mqttd-1
      MQTTD_PEER_BIND: mqttd-1:7001
      MQTTD_SWIM_BIND: mqttd-1:7946
      MQTTD_PEER_TLS_CERT: /e2e/pki/mqttd-1.pem
      MQTTD_PEER_TLS_KEY: /e2e/pki/mqttd-1.key
      MQTTD_ADMIN_CERT: /e2e/pki/mqttd-1.pem
      MQTTD_ADMIN_KEY: /e2e/pki/mqttd-1.key
    volumes:
      - ./pki:/e2e/pki:ro
      - ./acl.toml:/e2e/acl.toml:ro
      - ./cfg1:/cfg
    ports: ["11883:1883", "19443:9443", "18080:8080"]

  mqttd-2:
    <<: *node
    hostname: mqttd-2
    environment:
      MQTTD_NODE_ID: mqttd-2
      MQTTD_PEER_BIND: mqttd-2:7001
      MQTTD_SWIM_BIND: mqttd-2:7946
      MQTTD_SWIM_SEEDS: mqttd-1:7946
      MQTTD_PEER_TLS_CERT: /e2e/pki/mqttd-2.pem
      MQTTD_PEER_TLS_KEY: /e2e/pki/mqttd-2.key
      MQTTD_ADMIN_CERT: /e2e/pki/mqttd-2.pem
      MQTTD_ADMIN_KEY: /e2e/pki/mqttd-2.key
    volumes:
      - ./pki:/e2e/pki:ro
      - ./acl.toml:/e2e/acl.toml:ro
      - ./cfg2:/cfg
    ports: ["21883:1883", "29443:9443", "28080:8080"]

  mqttd-3:
    <<: *node
    hostname: mqttd-3
    environment:
      MQTTD_NODE_ID: mqttd-3
      MQTTD_PEER_BIND: mqttd-3:7001
      MQTTD_SWIM_BIND: mqttd-3:7946
      MQTTD_SWIM_SEEDS: mqttd-1:7946
      MQTTD_PEER_TLS_CERT: /e2e/pki/mqttd-3.pem
      MQTTD_PEER_TLS_KEY: /e2e/pki/mqttd-3.key
      MQTTD_ADMIN_CERT: /e2e/pki/mqttd-3.pem
      MQTTD_ADMIN_KEY: /e2e/pki/mqttd-3.key
    volumes:
      - ./pki:/e2e/pki:ro
      - ./acl.toml:/e2e/acl.toml:ro
      - ./cfg3:/cfg
    ports: ["31883:1883", "39443:9443", "38080:8080"]
