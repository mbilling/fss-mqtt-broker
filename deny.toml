# cargo-deny configuration — supply-chain gating for CI.
# Run: cargo deny check

[advisories]
version = 2
yanked = "deny"
# No ignores: the last one (RUSTSEC-2025-0141, bincode 1.x) was closed by the
# postcard codec succession (ADR 0052).
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"
deny = [
    # ADR 0053: the workspace crypto provider is aws-lc-rs; ring (maintenance-mode
    # upstream) must not re-enter the build. Nothing COMPILES ring
    # (`cargo tree -i ring` prints nothing), but Cargo.lock records optional
    # dependencies regardless of features, so the two crates whose *disabled*
    # ring features leave a phantom lock entry are wrapped; any other consumer
    # trips the ban. A wrapper may report "unmatched" when feature resolution
    # prunes that edge from cargo-deny's graph — a tolerated warning, kept so a
    # future resolution shift cannot flap the ban.
    { name = "ring", wrappers = ["quinn-proto", "rustls-webpki"] },
]
# Internal workspace crates are version-less `path` dependencies, which cargo-deny
# counts as wildcards. Allow only those; registry wildcards remain denied.
allow-wildcard-paths = true

[licenses]
version = 2
# Permissive licenses compatible with an Apache-2.0 project.
allow = [
    "Apache-2.0",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    # Mozilla's CA root-certificate bundle (webpki-root-certs), the TLS trust store
    # reqwest uses to verify the OTLP/HTTPS exporter endpoint (ADR 0020 OTLP export).
    # A permissive *data* license for the cert set, not code; standard across the
    # rustls ecosystem.
    "CDLA-Permissive-2.0",
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
